  const doelX = wk.kolkX, doelY = wk.kolkY + fh*0.35;              // voeten zo, dat zijn midden in de kolk komt
  const afstand = Math.hypot(o.x0 - doelX, o.y0 - doelY)*(1 - e);
  const hoek = o.zuigHoek + e*Math.PI*1.5;
  o.x = doelX + Math.cos(hoek)*afstand; o.y = doelY + Math.sin(hoek)*afstand;
  if(Math.random() < 0.3) deeltjes(o.x, o.y - fh*0.5, 1, { vMin:10, vMax:40, leven:0.3, r:1, fonkel:0.7, kleur:'rgb(255,240,210)' });
  if(v >= 1){ o.fase = 'binnen'; staat.binnen++; staat.binnenTypen.push(o.type); kleurPlons(wk.kolkX, wk.kolkY); }
}

// een blauwdruk-oelieboelie in een figuurtype veranderen
// =====================================================================
// (v1.32) HOOKY: de grijphaak
// Stap 1: mikken (katapult: Hooky vastpakken en wegtrekken), de haak gooien, missen (lijn rolt terug, opnieuw mikken)
// en kleine losse voorwerpen naar zich toe trekken. Slingeren en het kabelbaantje komen in de volgende stappen.
// =====================================================================
const HOOKY_BEREIK = 40*BLOK;      // zo ver reikt de haak, gemeten vanaf zijn hand (40 blokjes)
const HAAK_SNELHEID = 480;         // zo snel vliegt de haak (spelpixels per seconde)
const HAAK_OPROL = 520;            // zo snel rolt hij de lijn weer op
const TREK_SNELHEID = 60;          // zo snel schuift een getrokken voorwerp naar hem toe (lopen is ongeveer 53)
const GOOI_FPS = 12;               // tempo van de gooireeks
const GOOI_LOS = 6;                // in dit beeldje (0 t/m 7) laat hij de haak los
const TREK_FPS = 9;                // tempo van het trekken (hand over hand)
const OPROL_FPS = 16;              // bij het oprollen gaan zijn handen sneller
const RICHT_MIN = 0.55;            // zo ver (in o-hoogtes) moet je hem minstens wegtrekken; minder = niet gooien
const HOOKY_STOP = 0.3;            // een getrokken voorwerp stopt zo ver (in o-hoogtes) voor zijn midden
const TREKBAAR = new Set(['kist', 'boeken', 'blokken', 'cadeau', 'theepot', 'ton']);   // kleine losse voorwerpen
// (v1.41) ook een LOSSE balk of plank kan hij naar zich toe trekken (ook een gekantelde). Los = hij rust niet op
// een andere balk of plank, en er rust ook geen balk of plank op hem. Een balk uit een bouwwerk blijft dus vast
// (en daar kan de haak wel in vastslaan, voor een kabelbaan).
const LATTEN = new Set(['balk', 'plank']);
const isLat = ob => !!ob && (LATTEN.has(ob.soort) || (ob.soort === 'schuin' && LATTEN.has(ob.lat)));
function latLos(ob){
  const i = level.objecten.indexOf(ob); if(i < 0 || !level.objKaart) return false;
  const m = objectMaat(ob), B = level.breed;
  for(let by = ob.y; by < ob.y + m.h; by++) for(let bx = ob.x; bx < ob.x + m.b; bx++){
    if(bx < 0 || by < 0 || bx >= B || by >= LEVEL_HOOGTE || level.objKaart[by*B + bx] !== i) continue;
    for(const dy of [-1, 1]){ const n = objectOp(bx, by + dy); if(n && n !== ob && isLat(n)) return false; }
  }
  return true;
}
const isTrekbaar = ob => !!ob && (TREKBAAR.has(ob.soort) || (isLat(ob) && latLos(ob)));
// een getrokken balk: los tekenen tijdens het trekken, en daarna weer gewoon in het terrein
function latTrekStart(d){ if(!isLat(d)) return; latGetrokken.add(d); const m = objectMaat(d); vernieuwVak(d.x, d.y, d.x + m.b, d.y + m.h); }
function latTrekKlaar(d){
  if(!d || !latGetrokken.has(d)) return;
  latGetrokken.delete(d);
  if(level.objecten.includes(d)){ const m = objectMaat(d); vernieuwVak(d.x - 1, d.y, d.x + m.b + 1, d.y + m.h); }
}
const HOOKY_FASEN = ['richten', 'gooien', 'haakVliegt', 'trekken', 'oprollen', 'vasthouden'];
// waar in de plaatjes (plaatjespixels in het vakje) zijn hand zit: daar begint de lijn
const HOOKY_HAND_GOOI = [[105.0, 48.1], [110.3, 47.1]];   // beeldje 6 en 7 van de gooireeks (open hand, de haak is weg)
const HOOKY_HAND_VAST = [[93.4, 45.9], [93.3, 45.9], [93.4, 45.9], [93.5, 45.9], [91.2, 49.2], [91.1, 49.2], [93.3, 45.9], [93.6, 45.4]];   // (v1.33) beeldje 0 t/m 7 van de vasthoudreeks: de voorste vuist
const HOOKY_HAND_TREK = [[111.6, 76.2], [105.0, 77.1], [99.5, 78.2], [109.3, 75.9], [116.4, 73.8], [106.2, 76.8], [107.9, 77.2], [108.2, 77.4]];   // beeldje 0 t/m 7 van de trekreeks
const isHooky = o => o.type === 'hooky' && HOOKY_FASEN.includes(o.fase);

// de hand van Hooky in het spel (spelpixels)
function hookyHand(o){
  const k = FIGUUR_HOOGTE/CELL_H;
  const trek = o.fase === 'trekken' || o.fase === 'oprollen', vh = o.fase === 'vasthouden';
  const r = vh ? REEKSEN.hookyVast : trek ? REEKSEN.hookyTrek : REEKSEN.hookyGooi;
  const p = vh ? HOOKY_HAND_VAST[o.frame % 8] : trek ? HOOKY_HAND_TREK[o.frame % 8] : HOOKY_HAND_GOOI[1];
  const dy = ZACHT_FASEN.has(o.fase) ? zachtOppervlak(o.x, o.y) - o.y : 0;
  return { x: o.x + o.richting*(p[0] - r.anker)*k, y: o.y + dy + 1 - (r.celH - p[1])*k };
}
// Waar komt de haak terecht? Rechte lijn vanaf de hand, tot hij iets raakt of zijn bereik op is.
// soort: 'ding' (een voorwerp dat hij kan trekken), 'vast' (grond, muur, steen, balk, boom...), 'rand' of 'niets'
function haakRaak(x0, y0, dx, dy){
  const n = Math.hypot(dx, dy) || 1; dx /= n; dy /= n;
  for(let s = 0; s <= HOOKY_BEREIK; s += 2){
    const x = x0 + dx*s, y = y0 + dy*s;
    if(x < 0 || x >= level.B || y >= level.H) return { soort: 'rand', x, y, s };
    if(y < 0) continue;
    const bx = Math.floor(x/BLOK), by = Math.floor(y/BLOK);
    if(vast(bx, by)){
      const ob = objectOp(bx, by);
      if(ob && isTrekbaar(ob)) return { soort: 'ding', o: ob, x, y, s };   // (v1.41) ook een losse balk of plank
      return { soort: 'vast', x, y, s, bx, by };
    }
    for(const z of dingZones) if(x > z.x0 && x < z.x1 && y > z.y0 && y < z.y1) return { soort: 'vast', x, y, s, zone: z };
  }
  return { soort: 'niets', x: x0 + dx*HOOKY_BEREIK, y: y0 + dy*HOOKY_BEREIK, s: HOOKY_BEREIK };
}

// ---- mikken ----
function startRichten(o){
  if(o.type !== 'hooky' || o.haakOp || o.fase !== 'lopen') return false;
  o.loopRichting = o.richting; begin(o, 'richten'); o.frame = 0; o.frameTijd = 0;
  staat.richten = { o, id: null, p: null };
  return true;
}
// de richting van de haak: van de vinger (of muis) naar Hooky toe, en dan verder (zoals een katapult)
function richtVector(R){
  if(!R || !R.p) return null;
  const o = R.o, dx = o.x - R.p.x, dy = (o.y - FIGUUR_HOOGTE*0.55) - R.p.y;
  if(Math.hypot(dx, dy) < FIGUUR_HOOGTE*RICHT_MIN*klikFactor) return null;
  return { dx, dy };
}
function loslaten(gooien){
  const R = staat.richten; if(!R) return;
  staat.richten = null;
  const o = R.o; if(o.fase !== 'richten') return;
  const v = gooien ? richtVector(R) : null;
  if(!v){ begin(o, 'lopen'); o.richting = o.loopRichting; o.frame = 0; o.frameTijd = 0; return; }   // niet ver genoeg: gewoon verder lopen
  const n = Math.hypot(v.dx, v.dy);
  o.gooiDx = v.dx/n; o.gooiDy = v.dy/n;
  if(Math.abs(v.dx) > 1) o.richting = v.dx > 0 ? 1 : -1;
  begin(o, 'gooien'); o.frame = 1; o.frameTijd = 0;
}

// ---- een stap van Hooky (alles wat met de haak te maken heeft) ----
function hookyStap(o, dt){
  if(o.fase === 'richten'){
    const v = richtVector(staat.richten && staat.richten.o === o ? staat.richten : null);
    if(v && Math.abs(v.dx) > 2) o.richting = v.dx > 0 ? 1 : -1;   // hij draait zich naar waar hij gaat gooien
    if(!staat.richten || staat.richten.o !== o){ begin(o, 'lopen'); o.richting = o.loopRichting; }
    return;
  }
  if(o.fase === 'gooien'){
    o.frameTijd += dt;
    while(o.frameTijd >= 1/GOOI_FPS){ o.frameTijd -= 1/GOOI_FPS; o.frame++; }
    if(o.frame >= GOOI_LOS){
      o.frame = 7;
      const h = hookyHand(o), doel = haakRaak(h.x, h.y, o.gooiDx, o.gooiDy);
      o.haak = { x: h.x, y: h.y, x0: h.x, y0: h.y, dx: o.gooiDx, dy: o.gooiDy, s: 0, doel, mis: true, ding: null };
      begin(o, 'haakVliegt');
    }
    return;
  }
  const h = o.haak;
  if(o.fase === 'haakVliegt'){
    h.s = Math.min(h.doel.s, h.s + HAAK_SNELHEID*dt);
    h.x = h.x0 + h.dx*h.s; h.y = h.y0 + h.dy*h.s;
    if(h.s < h.doel.s) return;
    const d = h.doel;
    if(d.soort === 'ding' && level.objecten.includes(d.o) && isTrekbaar(d.o)){
      // raak! De haak zit vast in het voorwerp; het schuift naar Hooky toe
      const m = objectMaat(d.o), mid = (d.o.x + m.b/2)*BLOK;
      h.ding = d.o; h.ox = d.x - d.o.x*BLOK; h.oy = d.y - d.o.y*BLOK; h.kant = o.x > mid ? 1 : -1;
      deeltjes(d.x, d.y, 6, { vMin: 20, vMax: 60, leven: 0.25, r: 1, kleur: 'rgb(255,226,140)' });
      begin(o, 'trekken'); o.frame = 0; o.frameTijd = 0; latTrekStart(d.o);
      // (v1.53) een staande paal: bovenste derde = hij kantelt naar Hooky toe, onderste derde = van hem af; middelste derde = schuiven
      if(isPaal(d.o)){ const deel = paalDeel(d.o, d.y); if(deel !== 'midden' && startPaalKantel(o, deel)) return; }
      if(Math.abs(o.x - mid) < m.b*BLOK/2 + FIGUUR_HOOGTE*HOOKY_STOP){ eindTrekken(o); }   // het staat al vlak bij hem
      return;
    }
    // (v1.33) vast in muur, steen, rots, balk, plank, boog of boom: hij houdt het touw vast (over een rand: kabelbaan)
    const g = haakGreep(d, h.x0, h.y0);
    if(g.soort !== 'mis'){ startVasthouden(o, g); return; }
    // mis: tegen iets vasts (vonkjes) of in de lucht; de lijn rolt terug en hij mag opnieuw mikken
    if(d.soort === 'vast') deeltjes(h.x, h.y, 5, { vMin: 30, vMax: 80, leven: 0.2, r: 0.8, fonkel: 1, kleur: 'rgb(255,240,190)' });
    if(d.zone && d.zone.o.soort === 'hond') hondSchrik(d.zone.o, h.x0);   // (v1.42) het hondje schrikt wakker en blaft naar Hooky
    h.mis = true; begin(o, 'oprollen'); o.frame = 0; o.frameTijd = 0;
    return;
  }
  if(o.fase === 'trekken'){ trekStap(o, dt); return; }
  if(o.fase === 'vasthouden'){ vasthoudStap(o, dt); return; }
  if(o.fase === 'oprollen'){
    o.frameTijd += dt;
    while(o.frameTijd >= 1/OPROL_FPS){ o.frameTijd -= 1/OPROL_FPS; o.frame = (o.frame + 1) % 8; }
    const hand = hookyHand(o), ax = hand.x - h.x, ay = hand.y - h.y, a = Math.hypot(ax, ay), stap = HAAK_OPROL*dt;
    if(a <= stap + 1){
      const gelukt = !h.mis;
      o.haak = null; begin(o, 'lopen'); o.richting = o.loopRichting; o.frame = 0; o.frameTijd = 0;
      if(gelukt) o.haakOp = true;   // zijn beurt is voorbij: vanaf nu een gewone loper in Hooky-uiterlijk
      return;

  }
}
// het trekken: het voorwerp schuift blokje voor blokje naar Hooky toe (getekend schuift het soepel mee)
function trekStap(o, dt){
  const h = o.haak, d = h.ding;
  o.frameTijd += dt;
  while(o.frameTijd >= 1/TREK_FPS){ o.frameTijd -= 1/TREK_FPS; o.frame = (o.frame + 1) % 8; }
  if(h.paal){ paalTrekStap(o); return; }   // (v1.53) de paal kantelt: de haak draait mee
  if(!d || !level.objecten.includes(d)){ eindTrekken(o); return; }   // het voorwerp is weg (opgeblazen of aan het vallen)
  const m = objectMaat(d), s = h.kant;
  d.schuif = (d.schuif || 0) + s*TREK_SNELHEID*dt;
  while(Math.abs(d.schuif) >= BLOK){
    // al bij Hooky?
    const voorkant = (s > 0 ? d.x + m.b : d.x)*BLOK, tot = o.x - s*FIGUUR_HOOGTE*HOOKY_STOP;
    if((voorkant + s*BLOK - tot)*s > 0){ eindTrekken(o); return; }
    // zit er iets in de weg (grond, muur, een trede, een ander voorwerp, een boom)?
    const kol = s > 0 ? d.x + m.b : d.x - 1;
    let vrij = true;
    if(isLat(d)){   // (v1.41) een balk (ook een gekantelde): elk blokje van de balk moet een blokje opzij kunnen
      const i = level.objecten.indexOf(d), B = level.breed;
      for(let by = d.y; by < d.y + m.h && vrij; by++) for(let bx = d.x; bx < d.x + m.b && vrij; bx++){
        if(bx < 0 || by < 0 || bx >= B || by >= LEVEL_HOOGTE || level.objKaart[by*B + bx] !== i) continue;
        const nx = bx + s;
        if(nx >= 0 && nx < B && level.objKaart[by*B + nx] === i) continue;   // daar zit de balk zelf al
        if(vast(nx, by)) vrij = false;
      }
    }
    else for(let r = d.y; r < d.y + m.h && vrij; r++) if(vast(kol, r)) vrij = false;
    for(const z of dingZones) if(vrij && z.o !== d && kol*BLOK + BLOK > z.x0 && kol*BLOK < z.x1 && (d.y + m.h)*BLOK > z.y0 && d.y*BLOK < z.y1) vrij = false;
    if(!vrij){ eindTrekken(o); return; }
    d.x += s; d.schuif -= s*BLOK;
    if(d.soort === 'schuin'){   // (v1.41) een gekantelde balk: ook zijn hoekpunten een blokje opschuiven
      const dx = s*BLOK, sx = p => [p[0] + dx, p[1]];
      d.hoeken = d.hoeken.map(sx); d.boven = d.boven.map(sx); d.midden = sx(d.midden);
      if(d.P){ d.P = sx(d.P); d.bron = {...d.bron, x: d.bron.x + s}; }
    }
    herstempel(); maakDingZones(); grondWeg();   // wie erop stond en nu niets meer onder zich heeft, valt
    vernieuwVak(d.x - 2, d.y - 1, d.x + m.b + 2, d.y + m.h + 1);   // het gras waar het stond en waar het nu staat
    // (v1.41) een balk: Newton kijkt of hij nog goed ligt. Komt zijn midden over een rand, dan kantelt hij en laat Hooky los.
    if(isLat(d)){ staat.steunCheck = true; continue; }
    if(steunOnder(d, level.objecten.indexOf(d)) !== 'vast'){       // over de rand getrokken: het valt (Newton)
      d.schuif = 0; startVal(d); staat.steunCheck = true; eindTrekken(o); return;
    }
  }
  h.x = d.x*BLOK + d.schuif + h.ox; h.y = d.y*BLOK + h.oy;
}
function eindTrekken(o){
  const h = o.haak;
  if(h.ding){ h.ding.schuif = 0; latTrekKlaar(h.ding); h.ding = null; }
  h.paal = null;
  h.mis = false; begin(o, 'oprollen'); o.frame = 0; o.frameTijd = 0;
}
// =====================================================================
// (v1.53) HOOKY TREKT EEN STAANDE PAAL OM (Arjens keuzes van 23-11)
// Het hangt af van waar de haak de paal raakt:
// - bovenste derde: de voet blijft staan en de paal kantelt als stijve stok naar Hooky toe, tot hij ergens op rust.
//   Komt hij plat te liggen, dan kijkt Newton verder: steekt hij over een rand, dan kiept hij daaroverheen tot hij
//   ergens op rust (een loopplank); is er niets om op te rusten, dan glijdt hij weg en valt.
// - middelste derde: hij blijft rechtop en schuift naar Hooky toe (zoals een kist).
// - onderste derde: de voet schuift een stukje naar Hooky toe en de paal valt de andere kant op, tot hij ergens
//   tegenaan leunt; raakt hij niets, dan valt hij plat neer.
// =====================================================================
const PAAL_KANTEL_DUUR = 0.8;      // zo lang duurt het omkantelen (seconden)
const PAAL_SCHOP = 3;              // onderste derde: zo ver (blokjes) schuift de voet hoogstens naar Hooky toe
const isPaal = ob => !!ob && ob.soort === 'balk' && ob.stand === 'verticaal';
function paalDeel(p, y){
  const m = objectMaat(p), f = ((p.y + m.h)*BLOK - y)/(m.h*BLOK);
  return f > 2/3 ? 'boven' : f < 1/3 ? 'onder' : 'midden';
}
function startPaalKantel(o, deel){
  const h = o.haak, p = h.ding, m = objectMaat(p), w = m.b*BLOK, L = m.h*BLOK;
  const r = deel === 'boven' ? h.kant : -h.kant;   // naar welke kant de top valt (1 = naar rechts)
  const plek = level.objecten.indexOf(p); if(plek < 0) return false;
  level.objecten.splice(plek, 1); herstempel();
  const zone = (x, y) => { for(const z of dingZones) if(z.o !== p && x > z.x0 && x < z.x1 && y > z.y0 && y < z.y1) return true; return false; };
  // onderste derde: de voet schuift (als dat kan) een paar blokjes naar Hooky toe
  let schop = 0;
  if(deel === 'onder'){
    for(let s = 1; s <= PAAL_SCHOP; s++){
      const nx = p.x - r*s; let ok = true, steun = false;
      for(let by = p.y; by < p.y + m.h && ok; by++) for(let bx = nx; bx < nx + m.b && ok; bx++) if(bx < 0 || bx >= level.breed || vast(bx, by)) ok = false;
      for(let bx = nx; bx < nx + m.b; bx++) if(vast(bx, p.y + m.h)) steun = true;
      if(!ok || !steun) break;
      schop = s;
    }
  }
  const py = (p.y + m.h)*BLOK, P0 = [r > 0 ? (p.x + m.b)*BLOK : p.x*BLOK, py], px = P0[0] - r*schop*BLOK;
  const draai = (x, y, a) => [px + x*Math.cos(a) - y*Math.sin(a), py + x*Math.sin(a) + y*Math.cos(a)];
  // de staande paal ten opzichte van zijn draaipunt (de onderhoek aan de kant waar hij heen valt)
  let rust = null;
  const raakt = a => {
    for(let u = 1; u < L; u += 2) for(let v = 1; v < w; v += 2){
      const [wx, wy] = draai(r > 0 ? -v : v, -u, a), bx = Math.floor(wx/BLOK), by = Math.floor(wy/BLOK);
      if(wy >= level.H || bx < 0 || bx >= level.breed || vast(bx, by) || vallerOp(bx, by) || zone(wx, wy)){ rust = [wx, wy]; return true; }
    }
    return false;
  };
  let eindG = 90;
  for(let g = 1; g <= 90; g++) if(raakt(r*g*Math.PI/180)){ eindG = g - 1; break; }
  if(eindG < 3){ level.objecten.splice(plek, 0, p); herstempel(); return false; }   // zit klem: dan gewoon schuiven
  latTrekKlaar(p); vernieuwVak(p.x - 1, p.y - 1, p.x + m.b + 1, p.y + m.h + 1);
  const th = eindG*Math.PI/180;
  // de liggende balk waar hij uit 'ontstaat' (zo werkt het kantelen van balken al): naast het draaipunt
  const bron = {...p, stand: 'horizontaal', x: r > 0 ? px/BLOK : px/BLOK - m.h, y: py/BLOK - m.b};
  delete bron.schuif;
  let eind;
  if(eindG >= 90) eind = bron;   // plat neergekomen: Newton kijkt daarna of hij over een rand kiept
  else {
    const a = r*(th - Math.PI/2), x0 = bron.x*BLOK, x1 = x0 + L, dik = w;
    const hoeken = [[x0 - px, 0], [x1 - px, 0], [x1 - px, -dik], [x0 - px, -dik]].map(([x, y]) => draai(x, y, a));
    const boven = [hoeken[3], hoeken[2]].sort((q, s) => q[0] - s[0]);
    const xs = hoeken.map(q => q[0]), ys = hoeken.map(q => q[1]);
    const bx = Math.floor(Math.min(...xs)/BLOK), by = Math.floor(Math.min(...ys)/BLOK), graden = 90 - eindG;
    eind = { soort: 'schuin', lat: 'balk', maat: graden > STEIL_VANAF ? 'steil' : 'flauw', steil: graden > STEIL_VANAF,
      richting: boven[0][1] > boven[1][1] ? 1 : -1,
      x: bx, y: by, b: Math.ceil(Math.max(...xs)/BLOK) - bx, h: Math.ceil(Math.max(...ys)/BLOK) - by,
      hoeken, boven, hoek: a, lengte: L, dik, midden: draai((x0 + x1)/2 - px, -dik/2, a),

// tijdens het mikken: elastiekje naar de vinger, en een stippellijn naar waar de haak terechtkomt
function tekenHookyRichter(){
  const R = staat.richten; if(!R || !R.p || !staat.oelies.includes(R.o) || R.o.fase !== 'richten') return;
  const o = R.o, cx = o.x, cy = o.y - FIGUUR_HOOGTE*0.55;
  ctx.save(); ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,214,90,.55)'; ctx.lineWidth = 1.2; ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(R.p.x, R.p.y); ctx.stroke();
  ctx.setLineDash([]); ctx.fillStyle = 'rgba(255,214,90,.7)'; ctx.beginPath(); ctx.arc(R.p.x, R.p.y, 2.5, 0, Math.PI*2); ctx.fill();
  const v = richtVector(R);
  if(v){
    const hand = hookyHand(o), raak = haakRaak(hand.x, hand.y, v.dx, v.dy);
    const greep = raak.soort === 'vast' ? haakGreep(raak, hand.x, hand.y).soort : '';   // (v1.40) één keer uitrekenen
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.6; ctx.setLineDash([1, 4]);
    ctx.beginPath(); ctx.moveTo(hand.x, hand.y); ctx.lineTo(raak.x, raak.y); ctx.stroke();
    ctx.setLineDash([]);
    if(raak.soort === 'ding'){
      // dit voorwerp kan hij pakken: groen rondje, en een stippelrand om het voorwerp
      const m = objectMaat(raak.o);
      ctx.strokeStyle = 'rgba(120,240,140,.95)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(raak.x, raak.y, 4.5, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([4, 3]); ctx.lineWidth = 1.4;
      ctx.strokeRect(raak.o.x*BLOK - 2, raak.o.y*BLOK - 2, m.b*BLOK + 4, m.h*BLOK + 4);
    } else if(greep === 'kabel'){
      // (v1.33) de haak grijpt over de rand: een gouden haakje op de hoek = hier wordt het een kabelbaan
      const g = haakGreep(raak, hand.x, hand.y);
      ctx.fillStyle = 'rgba(255,205,60,.28)'; ctx.beginPath(); ctx.arc(g.randX, g.randY, 7, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,214,90,.95)'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(g.randX, g.randY, 7, 0, Math.PI*2); ctx.stroke();
      ctx.drawImage(goudHaakPlaatje(g.kant), g.randX - g.kant*3 - GOUD_HAAK_MAAT/2, g.randY - 1.5 - GOUD_HAAK_MAAT/2, GOUD_HAAK_MAAT, GOUD_HAAK_MAAT);   // (v1.40) kant-en-klaar
    } else if(greep === 'omlaag'){
      // (v1.36) het touw loopt omlaag naar de haak: ook een kabelbaan, een gouden rondje op de plek van de haak
      ctx.fillStyle = 'rgba(255,205,60,.28)'; ctx.beginPath(); ctx.arc(raak.x, raak.y, 7, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,214,90,.95)'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(raak.x, raak.y, 7, 0, Math.PI*2); ctx.stroke();
    } else if(greep === 'muur'){
      // (v1.33) de haak slaat vast, maar daar komt niemand langs: een wit stipje
      ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(raak.x, raak.y, 2.4, 0, Math.PI*2); ctx.fill();
    } else if(raak.soort === 'vast'){
      // hier valt niets te pakken: een kruisje
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(raak.x - 3, raak.y - 3); ctx.lineTo(raak.x + 3, raak.y + 3); ctx.moveTo(raak.x + 3, raak.y - 3); ctx.lineTo(raak.x - 3, raak.y + 3); ctx.stroke();
    } else {
      // het einde van zijn bereik
      ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(raak.x, raak.y, 3, 0, Math.PI*2); ctx.stroke();
    }
  }
  ctx.restore();
}

function verander(o, type){
  if(!(staat.voorraad[type] > 0)) return false;
  if(o.type !== 'blauwdruk' || o.fase !== 'lopen') return false;
  o.type = type; staat.voorraad[type]--;
  if(type === 'buildy') o.trapId = (staat.trapTeller = (staat.trapTeller || 0) + 1);   // elke Buildy bouwt zijn eigen trap
  deeltjes(o.x, o.y - FIGUUR_HOOGTE/2, 16, { vMin:30, vMax:110, leven:0.4, r:1.2, fonkel:0.5, kleur:() => `hsl(${200+Math.random()*40|0},90%,75%)` });
  if(type === 'buildy'){
    if(volgendeSteen(o)){ begin(o,'bouwen'); o.frame = 0; o.frameTijd = 0; }
    else { o.wilBouwen = staat.tijd; o.wilRichting = o.richting; }   // nog geen ruimte (bijv. op een trap of helling): even blijven proberen
  }
  if(type === 'balloony') startBallon(o);
  if(type === 'bomby') startBomby(o);   // meteen de bom neerzetten (of weigeren, bij het hondje)
  if(type === 'roby') startRoby(o);     // opstijgen en laag gaan vliegen
  bouwTypebalk();
  return true;
}

// (v1.59) zo ver (in spelpixels) moet het midden van een o buiten het veld zijn voor hij weg is: dan is hij helemaal uit beeld
const RAND_WEG = FIGUUR_HOOGTE*1.2;
const RAND_UITGEZONDERD = ['weg', 'dood', 'binnen', 'springen', 'opzuigen', 'verschijnen', 'opblazen', 'stijgen', 'zweven'];
function werkBij(dt){
  staat.tijd += dt;
  if(staat.pak) pakBijwerken();   // (v1.57) ingedrukt houden = vastpakken
  const t = staat.tijd, fh = FIGUUR_HOOGTE;

  // ---- het potlood ----
  // (v1.7) bij de start wacht het potlood tot alles wat valt of kantelt stil ligt, anders vallen de eersten erdoorheen
  if(staat.getekend === 0 && !staat.tekening && staat.vallers.some(f => !f.klaar)) staat.volgendeTekening = Math.max(staat.volgendeTekening, t + 0.5);
  if(!staat.tekening && staat.getekend < level.aantal && t >= staat.volgendeTekening){
    staat.tekening = { start:t, fase:'tekenen' }; staat.volgendeTekening = t + TEKEN_TUSSENPOOS;
  }
  const tk = staat.tekening;
  if(tk && tk.fase === 'tekenen' && t - tk.start >= TEKEN_DUUR){
    tk.fase = 'vullen'; tk.vulStart = t;
    const b = tekenPlek();
    staat.oelies.push({ type:'blauwdruk', x:b.x, y:b.y, vy:0, fase:'verschijnen', faseStart:t, richting:1, frame:1, frameTijd:0, geboren:t });
    staat.getekend++;
  }
  if(tk && tk.fase === 'vullen' && t - tk.vulStart >= VUL_DUUR) staat.tekening = null;
  if(!staat.poef && !staat.tekening && staat.getekend >= level.aantal){
    staat.poef = { start:t };
    const m = potloodMidden(potloodPunt(t));
    deeltjes(m.x, m.y, 34, { hoek:-Math.PI/2, spreiding:2.4, vMin:30, vMax:120, leven:0.6, r:1.2, fonkel:0.3, kleur:'rgb(215,235,255)', breed:50 });
  }

  // ---- de oelieboelies ----
  const per = 1/staat.fps;
  const snelheid = PAS_PER_CYCLUS * staat.pas * fh * staat.fps / LOOP_FRAMES;
  gumStap();
  for(const o of staat.oelies){
    if(o.bevroren) continue;   // de gum komt eraan: stokstijf blijven staan
    // (v1.59) links of rechts helemaal van de bladzijde af gelopen (of gevallen, gegleden...): weg, telt als verloren.
    // Balloony heeft daar zijn eigen regel voor (in ballonStap).
    if(!RAND_UITGEZONDERD.includes(o.fase) && (o.x < -RAND_WEG || o.x > level.B + RAND_WEG)){
      if(o.fase === 'kabel') o.aanKabel = null;
      begin(o, 'weg'); staat.af++; continue;
    }
    if((o.haak || (staat.richten && staat.richten.o === o)) && !HOOKY_FASEN.includes(o.fase)) hookyKwijt(o);   // (v1.32)
    if(o.fase === 'verschijnen'){ if(t - o.geboren >= VUL_DUUR){ begin(o,'vallen'); o.valStart = o.y; } continue; }
    if(o.fase === 'opzuigen'){ zuigStap(o, t); continue; }
    if(isRoby(o)){ robyStap(o, dt, snelheid); continue; }   // Roby: vliegen, boren en naar de wolk
    if(!o.bevroren && VLAM_FASEN.includes(o.fase) && lijfInVlam(o)){ gaatDood(o, 'roet'); continue; }   // in de vlam
    // wie de wolk raakt (vallend, weggekaatst, glijdend of lopend), wordt opgezogen
    if((o.fase === 'vallen' || o.fase === 'glijden' || o.fase === 'lopen' || o.fase === 'kabel') && staat.vliegStart === null && raaktWolk(o, wolk(t))){ if(o.fase === 'kabel') o.aanKabel = null; startOpzuigen(o, wolk(t)); continue; }
    if(o.fase === 'kabel'){ kabelStap(o, dt); continue; }                                         // (v1.33) glijden langs de kabelbaan
    if((o.fase === 'lopen' || o.fase === 'vallen') && staat.kabels.length && kabelPak(o)) continue;   // (v1.33) over de haak lopen: touw pakken
    if(o.fase === 'vallen'){ pakParachute(o); valStap(o, dt);
      if(o.fase === 'vallen' || o.fase === 'lopen'){ const z = zoneOp(o.x, o.y); if(z && z.o.soort === 'cactus') gaatDood(o, 'leeglopen'); }
      continue; }
    if(o.fase === 'glijden'){ glijStap(o, dt); continue; }
    if(o.fase === 'aanloop'){
      if(t - o.faseStart >= AANLOOP_DUUR){ begin(o,'springen'); o.x0 = o.x; o.y0 = o.y; }
      continue;
    }
    if(o.fase === 'springen'){
      const wk = wolk(t), v = Math.min(1,(t - o.faseStart)/SPRONG_DUUR);
      const eindY = wk.kolkY + fh*0.35, top = Math.min(o.y0, eindY) - fh*0.9;
      o.x = o.x0 + (wk.kolkX - o.x0)*v;
      o.y = (1-v)*(1-v)*o.y0 + 2*(1-v)*v*top + v*v*eindY;
      if(v >= 1){ o.fase = 'binnen'; staat.binnen++; staat.binnenTypen.push(o.type); kleurPlons(wk.kolkX, wk.kolkY); }
      continue;
    }
    if(o.fase === 'dood'){
      if(o.doodSoort === 'leeglopen') leegStapje(o, dt);
      if(o.doodSoort === 'slinger'){
        o.slVy += SLINGER_ZW*dt; o.x += o.slVx*dt; o.y += o.slVy*dt; o.slDraai += o.slTol*dt;
        if(Math.random() < dt*20) deeltjes(o.x, o.y - fh/2, 1, { vMin:5, vMax:30, leven:0.55, r:1.3, fonkel:1, kleur: () => Math.random() < 0.6 ? 'rgb(255,226,90)' : 'rgb(255,255,255)', gloed:false });
      }
      if(t - o.faseStart >= (o.doodSoort === 'pletter' ? PLETTER_DUUR : o.doodSoort === 'plons' ? PLONS_DUUR : o.doodSoort === 'leeglopen' ? LEEG_DUUR : o.doodSoort === 'slinger' ? SLINGER_DUUR : DOOD_DUUR)) o.fase = 'weg'; continue; }
    if(isHooky(o)){ hookyStap(o, dt); continue; }   // (v1.32) Hooky: mikken, gooien, trekken, oprollen
    if(o.fase === 'leggen'){ leggenStap(o); continue; }
    if(o.fase === 'weigeren'){ weigerenStap(o); continue; }
    if(o.fase === 'bouwen'){ bouwStap(o, dt, per); continue; }
    if(o.fase === 'eten'){ etenStap(o, dt); continue; }
    if(o.fase === 'krak'){ krakStap(o); continue; }
    // Buildy die nog wil bouwen: begint zodra er ruimte is. Draait hij om (muur) of lukt het na 1,5 sec niet, dan niet meer.
    if(o.wilBouwen !== undefined && o.fase === 'lopen'){
      if(o.richting !== o.wilRichting || t - o.wilBouwen > BOUW_PROBEER) o.wilBouwen = undefined;
      else if(volgendeSteen(o)){ o.wilBouwen = undefined; begin(o,'bouwen'); o.frame = 0; o.frameTijd = 0; continue; }
    }
    if(o.fase === 'duiken'){ duikStap(o, dt); continue; }
    if(o.fase === 'draad'){ draadStap(o, dt, snelheid); continue; }
    if(o.fase === 'verdwaald'){ if(t - o.faseStart >= DRAAD_DOOD_VERVAAG) o.fase = 'weg'; continue; }
    if(o.fase === 'opspringen'){ opspringStap(o); continue; }
    if(o.fase === 'landen'){ if(t - o.faseStart >= LANDING_DUUR) wordPaddenstoel(o); continue; }
    if(o.fase === 'opstappen'){ opstapStap(o); continue; }
    if(o.fase === 'opblazen' || o.fase === 'stijgen' || o.fase === 'zweven'){ ballonStap(o, dt); continue; }
    if(o.fase === 'veren'){
      const v = (t - o.faseStart)/VEER_DUUR;
      if(v > 0.62 && !o.veer2 && o.veerKussen){ o.veer2 = true; o.veerKussen.boing = t - KUSSEN_BOING_DUUR*0.45; }   // tweede, kleiner veertje
      if(v >= 1){ begin(o,'lopen'); o.frame = 0; o.frameTijd = 0; o.veerKussen = null; }
      continue;
    }
    if(o.fase === 'lopen'){
      if(staat.pak && staat.pak.o === o && staat.pak.actief) continue;   // (v1.57) vastgepakt: blijft staan
      // (v1.54) op ijs aan het remmen voor een muur: even stilstaan in zijn glijhouding, met wat ijsgruis
      if(o.ijsRem){
        if(o.ijsRemStart === o.faseStart && t < o.ijsRem){
          if(Math.random() < dt*30) deeltjes(o.x + o.richting*6, o.y - 1, 1, { hoek: -Math.PI/2 - o.richting*0.8, spreiding: 0.8, vMin: 20, vMax: 60, zw: 300, leven: 0.3, r: 0.8, fonkel: 0.5, kleur: 'rgb(240,250,250)', gloed: false });
          continue;
        }
        const nog = o.ijsRemStart === o.faseStart; o.ijsRem = 0;
        if(nog){ o.ijsDraai = true; draaiOm(o); o.ijsDraai = false; }
      }
      const sn = isIjs(Math.floor(o.x/BLOK), Math.round(o.y/BLOK)) ? snelheid*IJS_SNEL : snelheid;   // (v1.54) glad: dubbel tempo
      o.frameTijd += dt;
      while(o.frameTijd >= per){ o.frameTijd -= per; o.frame = (o.frame+1) % LOOP_FRAMES; }
      if(o.type === 'rocky' && !o.hapOp && rockyKijkt(o, dt, sn)) continue;   // Rocky komt iets tegen: eten (of KRAK)
      loopStap(o, dt, sn);
      pakParachute(o);
      if(o.fase !== 'lopen') continue;
      if(bijPaddenstoel(o)) continue;
      // vlak bij de toverwolk? dan aanloop nemen voor de sprong
      const wk = wolk(t), dx = (wk.kolkX - o.x)*o.richting;
      if(dx > 40 && dx < 100 && Math.abs(wk.kolkY + fh*0.35 - o.y) < 110){ begin(o,'aanloop'); o.frame = 0; }
    }
  }
  staat.oelies = staat.oelies.filter(o => o.fase !== 'binnen' && o.fase !== 'weg' && o.fase !== 'paddenstoel');
  for(const h of level.objecten) if(h.soort === 'hond') hondStap(h, t);
  for(const p of staat.paddenstoelen) if(p.klaar == null && (t - p.start)*GROEI_FPS >= 6) p.klaar = t;
  for(const k of staat.kussens) kussenStap(k, dt);
  staat.kussens = staat.kussens.filter(k => !k.weg);
  // Newton: staat alles nog ergens op? (bij de start, na een knal, na een landing)
  if(staat.steunCheck) controleerSteun();
  for(const p of staat.parachutes) parachuteStap(p, dt);
  stenenStap(dt);
  // Bomby's bommen, vallende en kantelende balken, de knallen en de wolkjes
  for(const b of staat.bommen) if(!b.weg) bomStap(b, dt);
  staat.bommen = staat.bommen.filter(b => !b.weg);
  for(const f of staat.vallers) vallerStap(f, dt);
  staat.vallers = staat.vallers.filter(f => !f.klaar);
  staat.boems = staat.boems.filter(e => t - e.start < BOEM_TOTAAL);
  staat.wolkjes = staat.wolkjes.filter(w => t - w.start < WOLKJE_DUUR);
  staat.knallen = staat.knallen.filter(k => t - k.start < 8/KNAL_FPS + 0.3);

  // ---- effectjes ----
  for(const d of staat.stofjes){
    d.vy += d.zw*dt; d.x += d.vx*dt; d.y += d.vy*dt;
    d.vx *= 0.96; d.vy = d.vy*0.96 - (d.zw ? 0 : 12*dt);
  }
  staat.stofjes = staat.stofjes.filter(d => t - d.start < d.leven);
  staat.flitsen = staat.flitsen.filter(f => t - f.start < 0.4);

  // ---- het einde: iedereen getekend en niemand meer onderweg ----
  if(staat.eindTijd === null && staat.getekend >= level.aantal && staat.oelies.length === 0) staat.eindTijd = t;
  if(staat.eindTijd !== null && staat.schuifStart === null && t - staat.eindTijd >= RUST_VOOR_EINDE){
    staat.schuifStart = t; staat.camVan = staat.camX; LOEP.doel = 1; LOEP.focus = null;   // (v1.48) aan het eind zoomt de loep uit
  }
  if(staat.schuifStart !== null && staat.vliegStart === null && t - staat.schuifStart >= SCHUIF_DUUR){
    staat.vliegStart = t; staat.volgendeUitsprong = t + VLIEG_DUUR + 0.3;
  }
  if(staat.vliegStart !== null && staat.uitgesprongen < staat.binnen && t >= staat.volgendeUitsprong){
    const wk = wolk(t);
    staat.uitspringers.push({ start:t, x0:wk.kolkX, y0:wk.kolkY, kleur: staat.uitgesprongen % KLEUREN.length, type: staat.binnenTypen[staat.uitgesprongen] });
    staat.uitgesprongen++; staat.volgendeUitsprong = t + UITSPRING_TUSSENPOOS;
  }
  for(const u of staat.uitspringers){
    if(!u.klaar && t - u.start >= BOEK_SPRONG_DUUR){
      u.klaar = true; staat.inBoek++;
      if(staat.inBoek === 1) staat.wisselStart = t;
      const k = kamerIndeling(); kleurPlons(k.kx + BOEK_X*k.s, k.ky + BOEK_Y*k.s);
    }
  }
  staat.uitspringers = staat.uitspringers.filter(u => !u.klaar);
  if(staat.vliegStart !== null && staat.inBoek >= staat.binnen && !staat.uitslagGetoond){
    if(!staat.boekKlaar) staat.boekKlaar = t;
    if(t - staat.boekKlaar >= 0.7){ staat.uitslagGetoond = true; toonUitslag(); }
  }

  // ---- zelf rondkijken in brede levels ----
  if(staat.schuifStart === null){
    const r = (toetsen.ArrowRight||toetsen.KeyD ? 1 : 0) - (toetsen.ArrowLeft||toetsen.KeyA ? 1 : 0);
    if(r) staat.camX = begrensCamera(staat.camX + r*700*dt/tempo);   // rondkijken gaat niet mee met de spelsnelheid
  }
}

function camera(){
  if(staat.schuifStart === null) return staat.camX;
  const v = Math.min(1, (staat.tijd - staat.schuifStart)/SCHUIF_DUUR);
  const e = v < 0.5 ? 4*v*v*v : 1 - Math.pow(-2*v + 2, 3)/2;
  const doel = level.B + SCHUIF_DEEL*beeld.breed - beeld.breed;
  return staat.camVan + (doel - staat.camVan)*e;
}

function tekenSchets(){
  const tk = staat.tekening; if(!tk) return;
  const t = staat.tijd;
  let v = 1, alpha = 0.9;
  if(tk.fase === 'tekenen') v = Math.min(1,(t-tk.start)/TEKEN_DUUR);
  else alpha = 0.9*(1 - Math.min(1,(t-tk.vulStart)/VUL_DUUR));
  const eind = puntOpOmtrek(v);
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = `rgba(205,228,255,${alpha})`; ctx.lineWidth = 1.5;
  ctx.shadowColor = 'rgba(140,190,255,0.8)'; ctx.shadowBlur = 4;
  ctx.beginPath();
  for(let i=0;i<eind.i;i++){
    const s = omtrekNaarWereld(OMTREK[i][0]+TRIL[i][0], OMTREK[i][1]+TRIL[i][1]);
    i===0 ? ctx.moveTo(s.x,s.y) : ctx.lineTo(s.x,s.y);
  }
  const e = omtrekNaarWereld(eind.px, eind.py); ctx.lineTo(e.x,e.y);
  ctx.stroke(); ctx.restore();
}
function tekenPotlood(){
  if(!potloodImg.complete) return;
  let schaal = 1, alpha = 1;
  if(staat.poef){
    const v = Math.min(1, (staat.tijd - staat.poef.start)/POEF_DUUR);
    if(v >= 1) return;
    const e = v*v; schaal = 1 - 0.8*e; alpha = 1 - e;
  }
  const p = potloodPunt(staat.tijd), m = potloodMidden(p), s = POTLOOD_HOOGTE/POTLOOD_H;

function tekenFlitsen(){

// ---- plons: een o valt in het water (plons.png, gemaakt met ChatGPT) ----
// beeldje 1-5: de plons, 6-7: een spookje met aureool stijgt op; daarna zweeft het spookje nog even weg
const plonsImg = new Image(); plonsImg.src = "plaatjes/plonsimg.webp";
const PLONS_CEL = 136, PLONS_CH = 195, PLONS_ANKER = 192.5, PLONS_BEELDEN = 7;
const PLONS_SCHAAL = 0.32;       // van plaatjespixels naar spelpixels (de hoogste plons wordt zo'n 54 hoog)
const PLONS_BEELD_DUUR = 0.13;   // zo lang staat elk beeldje
const PLONS_NA = 0.6;            // zo lang zweeft het spookje daarna nog weg
const PLONS_DUUR = PLONS_BEELDEN*PLONS_BEELD_DUUR + PLONS_NA;
function tekenPlons(c, x, y, v){  // v = seconden sinds de plons
  if(!plonsImg.complete || !plonsImg.width) return;
  let beeld = Math.floor(v/PLONS_BEELD_DUUR), op = 0, alpha = 1;
  if(beeld >= PLONS_BEELDEN){
    const k = Math.min(1, (v - PLONS_BEELDEN*PLONS_BEELD_DUUR)/PLONS_NA);
    beeld = PLONS_BEELDEN - 1; op = k*22; alpha = 1 - k;
  }
  const s = PLONS_SCHAAL;
  c.save(); c.globalAlpha = Math.max(0, alpha);
  c.drawImage(plonsImg, beeld*PLONS_CEL, 0, PLONS_CEL, PLONS_CH,
              x - PLONS_CEL*s/2, y - PLONS_ANKER*s - op, PLONS_CEL*s, PLONS_CH*s);
  c.restore();
}
function tekenOelie(o){
  if(!loopImg.complete) return;
  const fh = fhVan(o), fw = fh*CELL_W/CELL_H, t = staat.tijd;
  let sx = 1, sy = 1, draai = 0, dy = 0, alpha = Math.min(1, (t - o.geboren)/VUL_DUUR), filter = 'none';
  if(o.bevroren){   // geschrokken van de gum: even opspringen, dan trillend wachten; tijdens het gummen vervagen
    const s = t - o.schrik; if(s > 0 && s < 0.3) dy -= Math.sin(s/0.3*Math.PI)*5;
    if(s > 0) draai = Math.sin(t*38 + o.x)*0.05;
    if(o.gegumd){ const v = Math.min(1, (t - o.gegumd)/GUM_WRIJF); alpha *= 1 - v; sy *= 1 - 0.25*v; }
  }
  if(o.fase === 'aanloop'){ const v = (t - o.faseStart)/AANLOOP_DUUR; sy = 1 - 0.18*Math.sin(v*Math.PI); sx = 1 + 0.1*Math.sin(v*Math.PI); }
  if(o.fase === 'springen'){
    const v = Math.min(1,(t - o.faseStart)/SPRONG_DUUR); draai = 0.5*v;
    if(v < 0.2) sy = 1 + 0.12*(1 - v/0.2);
    if(v > 0.6){ const k = (v-0.6)/0.4; sx = sy = 1 - 0.8*k; alpha = 1 - k; }
  }
  if(o.fase === 'opzuigen'){
    const v = Math.min(1,(t - o.faseStart)/ZUIG_DUUR); draai = v*Math.PI*3; sx = sy = 1 - 0.85*v; alpha = 1 - 0.8*v*v;
  }
  if(o.fase === 'dood' && o.doodSoort === 'slinger'){
    const v = (t - o.faseStart)/SLINGER_DUUR; draai = o.slDraai; alpha = v > 0.75 ? Math.max(0, 1 - (v - 0.75)/0.25) : 1;
  }
  if(o.fase === 'dood'){
    const v = Math.min(1,(t - o.faseStart)/DOOD_DUUR);
    if(o.doodSoort === 'plof'){ const k = Math.min(1, v/0.12); sy = 1 - 0.75*k; sx = 1 + 0.5*k; alpha = v < 0.4 ? 1 : 1 - (v-0.4)/0.6; }
    if(o.doodSoort === 'plons'){ dy = Math.min(1, (t - o.faseStart)/0.3)*fh; }  // snel kopje onder; de plons zelf tekent tekenPlons
    if(o.doodSoort === 'roet'){ filter = `brightness(${Math.max(0.15, 1 - v*3)})`; sx = sy = 1 - 0.4*v; alpha = 1 - v; }
  }
  if(o.fase === 'draad' || o.fase === 'verdwaald') return; // onder de grond: alleen de draad is te zien
  if(o.fase === 'kabel') return;   // (v1.33) die tekent tekenKabelHangers, over het touw heen
  if(o.type === 'roby'){ tekenRoby(o); return; }
  if(o.fase === 'dood' && o.doodSoort === 'leeglopen'){ tekenLeeglopen(o); return; }
  if(o.type === 'balloony' && tekenBalloony(o, alpha)) return;
  let lift = 0;
  if(o.fase === 'duiken' && o.zakStart === null) lift = [0, 0, 0.35, 0.3, 0][o.frame]*fh;
  if(o.fase === 'duiken' && o.zakStart !== null) dy = Math.min(1, (t - o.zakStart)/ZAK_DUUR)*fh*1.2;
  if(o.fase === 'veren'){ const vv = veerVorm((t - o.faseStart)/VEER_DUUR); lift = vv.lift; sx = vv.sx; sy = vv.sy; }
  if(o.fase === 'opspringen') sx = Math.cos((t - o.faseStart)/OPSPRING_DUUR*Math.PI*4);
  if(o.fase === 'landen'){ const v = (t - o.faseStart)/LANDING_DUUR; sy = 1 - 0.12*Math.sin(v*Math.PI); sx = 1 + 0.08*Math.sin(v*Math.PI); }
  // op een flauwe helling: de voeten netjes op het schuine vlak (de trapjes eronder zie je niet)
  let opHelling = false;
  if(o.fase === 'lopen' || isHooky(o)){
    const hl = objectOp(Math.floor(o.x/BLOK), Math.round(o.y/BLOK));
    if(hl && (hl.soort === 'helling' || hl.soort === 'schuin') && !gangOp(Math.floor(o.x/BLOK), Math.round(o.y/BLOK) - 1)){ const hy = hellingOppervlak(hl, o.x); if(Math.abs(hy - o.y) < BLOK*1.5){ dy += hy - o.y; opHelling = true; } }
  }
  // (v1.6) op zachte grond en rots: de voeten op de afgeronde rand, niet op de blokjes eronder
  if(!opHelling && ZACHT_FASEN.has(o.fase)) dy += zachtOppervlak(o.x, o.y) - o.y;
  ctx.save();
  if(o.fase === 'duiken' || o.fase === 'opspringen'){
    // alleen het deel boven de grond laten zien
    const grens = o.fase === 'duiken' ? o.grondY : o.oppY;
    ctx.beginPath(); ctx.rect(o.x - fh*3, grens - fh*6, fh*6, fh*6); ctx.clip();
  }
  ctx.globalAlpha = Math.max(0, alpha);
  ctx.translate(Math.round(o.x), Math.round(o.y + dy - lift) + 1);
  if(o.fase === 'springen' || o.fase === 'opzuigen' || (o.fase === 'dood' && o.doodSoort === 'slinger')){ ctx.translate(0,-fh/2); ctx.rotate(draai); ctx.translate(0,fh/2); }
  if(o.fase === 'glijden'){ const m = objectMaat(o.helling); ctx.rotate(o.richting*Math.atan2(m.h, m.b)*0.35); }
  if(o.fase === 'dood' && o.doodSoort === 'plons'){
    // alleen het deel boven water laten zien
    ctx.beginPath(); ctx.rect(-fw, -fh*2, fw*2, fh*2 - dy); ctx.clip();
  }
  ctx.scale(o.richting*sx, sy);
  if(filter !== 'none') ctx.filter = filter;
  const r = reeks(o), rw = fh*r.cel/CELL_H, rh = fh*r.celH/CELL_H;
  ctx.drawImage(CONTRAST.aan && r === REEKSEN.blauwdruk ? witteVersie(r.img) : r.img, o.frame*r.cel,0,r.cel,r.celH, -r.anker*fh/CELL_H, -rh, rw, rh);
  ctx.restore();
  if(o.fase === 'krak') tekenSterretjes(o);
}

// ---- Balloony tekenen ----
// in de ballon, vallend en te pletter tekenen we hier; lopen (en springen, opzuigen) gaat via tekenOelie
function tekenBalloony(o, alpha){
  const t = staat.tijd;
  if(o.fase === 'opblazen' || o.fase === 'stijgen' || o.fase === 'zweven'){
    const maat = ballonMaat(o), rij = o.kussen ? 0 : 4;
    // één vaste tekening die als een slinger rustig heen en weer kantelt, met het draaipunt bovenin de ballon
    const hoek = Math.sin(t*BALLON_SLINGER + (o.geboren || 0)*3)*BALLON_KANTEL*Math.min(1, maat);
    const px = o.x + BALLON_HUID_DX*maat*ballonKant(o), py = o.y - BALLON_TOP*maat*0.92;
    ctx.save();
    ctx.translate(px, py); ctx.rotate(hoek); ctx.translate(-px, -py);
    tekenBeeldje(ctx, BL_BALLON, rij, o.x, o.y + 1, SP*BS*maat, ballonKant(o) < 0);
    ctx.restore();
    return true;
  }
  if(o.fase === 'vallen'){
    const beeld = Math.floor((t - o.faseStart)*BALLOONY_VAL_FPS) % 8;
    ctx.save(); ctx.globalAlpha = Math.max(0, alpha);
    tekenBeeldje(ctx, BL_VAL, beeld, Math.round(o.x), Math.round(o.y - FIGUUR_HOOGTE/2), SP, o.richting < 0);
    ctx.restore();
    return true;
  }
  if(o.fase === 'dood' && o.doodSoort === 'pletter'){
    const v = (t - o.faseStart)/PLETTER_DUUR, beeld = Math.min(7, Math.floor(v*8));
    ctx.save(); ctx.globalAlpha = v > 0.85 ? Math.max(0, 1 - (v - 0.85)/0.15) : 1;
    tekenBeeldje(ctx, BL_PLETTER, beeld, Math.round(o.x), Math.round(o.y) + 1, SP, o.richting < 0);
    ctx.restore();
    return true;
  }
  return false;
}
// de vorm van een o die op het kussen landt: platgedrukt, opveren (uitgerekt), nog een klein veertje
function veerVorm(v){
  v = Math.max(0, Math.min(1, v));
  const golf = (a, b) => Math.sin(Math.PI*(v - a)/(b - a));
  if(v < 0.18) return { lift:0, sx: 1 + 0.28*golf(0, 0.36), sy: 1 - 0.32*golf(0, 0.36) };            // wegzakken
  if(v < 0.55){ const k = golf(0.18, 0.55); return { lift: VEER_HOOG*k, sx: 1 - 0.08*k, sy: 1 + 0.12*k }; }   // omhoog, uitgerekt
  if(v < 0.68){ const k = golf(0.55, 0.68); return { lift:0, sx: 1 + 0.12*k, sy: 1 - 0.14*k }; }           // klein deukje
  if(v < 0.9){ const k = golf(0.68, 0.9); return { lift: VEER_HOOG2*k, sx: 1 - 0.03*k, sy: 1 + 0.05*k }; } // klein veertje
  return { lift:0, sx:1, sy:1 };
}
function tekenKussens(){
  const t = staat.tijd, maat = KUSSEN_BREED/128;
  for(const k of staat.kussens){
    if(k.ligt === null){
      // vallend: beeldje 1 (schuin), een beetje tollend
      ctx.save(); ctx.translate(k.x, k.y - 14); ctx.rotate(Math.sin(k.draai)*0.35);
      tekenBeeldje(ctx, BL_KUSSEN, 0, 0, 14, maat, false); ctx.restore();
      continue;
    }
    let beeld = 7;
    const land = t - k.ligt;
    if(land < KUSSEN_LAND_DUUR) beeld = Math.min(7, Math.floor(land/KUSSEN_LAND_DUUR*8));
    if(k.boing !== null && t - k.boing < KUSSEN_BOING_DUUR) beeld = Math.min(7, 1 + Math.floor((t - k.boing)/KUSSEN_BOING_DUUR*7));
    tekenBeeldje(ctx, BL_KUSSEN, beeld, k.x, k.y + 1, maat, false);
  }
}
function tekenKnallen(){
  const t = staat.tijd;
  for(const k of staat.knallen){
    const v = (t - k.start)*KNAL_FPS, beeld = Math.min(7, Math.floor(v));
    // de laatste beeldjes: de lege mand zakt weg en vervaagt
    const na = Math.max(0, v - 4)/4.5;
    ctx.save(); ctx.globalAlpha = Math.max(0, 1 - na*na);
    tekenBeeldje(ctx, BL_KNAL, beeld, k.x, k.y + na*12, SP*BS*k.maat, false);
    ctx.restore();
  }
}
function reeks(o){
  if(o.type === 'buildy') return o.fase === 'bouwen' ? REEKSEN.bouwen : REEKSEN.buildy;
  if(o.type === 'balloony') return { img: BL_LOOP.img, cel: BL_LOOP.cel, celH: BL_LOOP.celH, anker: BL_LOOP.ankerX };
  if(o.type === 'fungy') return (o.fase === 'duiken' || o.fase === 'opspringen' || o.fase === 'landen') ? REEKSEN.duiken : REEKSEN.fungy;
  if(o.type === 'rocky') return o.fase === 'eten' ? REEKSEN.rockyEet : o.fase === 'krak' ? REEKSEN.rockyKrak : REEKSEN.rocky;
  if(o.type === 'hooky' && o.fase === 'vasthouden') return REEKSEN.hookyVast;
  if(o.type === 'hooky') return (o.fase === 'richten' || o.fase === 'gooien' || o.fase === 'haakVliegt') ? REEKSEN.hookyGooi : (o.fase === 'trekken' || o.fase === 'oprollen') ? REEKSEN.hookyTrek : REEKSEN.hooky;
  if(o.type === 'bomby') return o.fase === 'leggen' ? REEKSEN.bombyLeg : o.fase === 'weigeren' ? REEKSEN.bombyNee : (o.bomWeg ? REEKSEN.bombyLeeg : REEKSEN.bomby);
  return REEKSEN.blauwdruk;
}
// het stekje op de plek waar Fungy de grond in dook
function tekenStekjes(){
  const t = staat.tijd, bron = verschrompelGrijs;
  const duurReeks = VS_BEELDEN/VERSCHROMPEL_FPS;
  staat.stekjes = staat.stekjes.filter(s => s.weg === null || t - s.weg < duurReeks + STEKJE_VERVAAG);
  if(!bron) return;
  const schaal = FIGUUR_HOOGTE/128*STEKJE_MAAT;
  for(const s of staat.stekjes){
    let beeld = 0, alpha = 1;
    if(s.weg !== null){
      const v = t - s.weg;
      beeld = Math.min(VS_BEELDEN - 1, Math.floor(v*VERSCHROMPEL_FPS));
      if(v > duurReeks) alpha = Math.max(0, 1 - (v - duurReeks)/STEKJE_VERVAAG);
    }
    const op = Math.min(1, (t - s.start)/STEKJE_OPKOM), opE = 1 - (1-op)*(1-op);   // uit de grond omhoog
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.translate(Math.round(s.x), Math.round(s.y) + 1);
    ctx.scale(s.richting*schaal, schaal*opE);
    ctx.drawImage(bron, beeld*VS_CEL, 0, VS_CEL, VS_H, -VS_CEL/2, -VS_ANKER_Y, VS_CEL, VS_H);
    ctx.restore();
  }
}
// de schimmeldraad onder de grond
function tekenDraad(o){
  const d = o.draad || o.draadResten; if(!d) return;
  const t = staat.tijd, fh = FIGUUR_HOOGTE;
  let alpha = 1;
  if(d.weg != null){ alpha = 1 - (t - d.weg)/(d.vervaag || 0.5); if(alpha <= 0) return; }
  const oud = o.draad; o.draad = d;
  const pad = [];
  for(let u = 0; u < d.lengte; u += 2) pad.push(draadPunt(o, u));
  pad.push(draadPunt(o, d.lengte));
  const lijn = (breedte, kleur) => {
    ctx.strokeStyle = kleur; ctx.lineWidth = breedte; ctx.beginPath();
    pad.forEach((p,i) => i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y)); ctx.stroke();
  };
  ctx.save(); ctx.globalAlpha = alpha; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const hover = staat.draadOnderMuis === o && d.weg == null;
  ctx.shadowColor = 'rgba(255,170,90,.9)'; ctx.shadowBlur = hover ? 10 : 5;
  lijn(hover ? 5 : 3.2, 'rgba(255,175,110,.45)');
  ctx.shadowBlur = 0;
  lijn(1.3, 'rgba(255,240,215,.95)');
  // zijtakjes
  ctx.strokeStyle = 'rgba(255,230,200,.7)'; ctx.lineWidth = 0.8;
  for(let u = 26; u < d.lengte - 4; u += 13){
    const p = draadPunt(o, u), kant = ruis(u, 3) > 0.5 ? 1 : -1, l = 3 + ruis(u, 7)*4;
    ctx.beginPath(); ctx.moveTo(p.x, p.y);
    ctx.quadraticCurveTo(p.x + o.richting*l*0.3, p.y + kant*l*0.7, p.x + o.richting*l*0.9, p.y + kant*l);
    ctx.stroke();
  }
  // de gloeiende kop
  if(d.weg == null){
    const k = draadPunt(o, d.lengte), puls = 1 + 0.3*Math.sin(t*10);
    const g = ctx.createRadialGradient(k.x,k.y,0,k.x,k.y,5*puls);
    g.addColorStop(0,'rgba(255,250,235,1)'); g.addColorStop(1,'rgba(255,180,100,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(k.x,k.y,5*puls,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
  o.draad = oud;
}
function tekenPaddenstoel(p){
  const r = REEKSEN.groeien; if(!r.img.complete) return;
  const t = staat.tijd, fh = FIGUUR_HOOGTE*PADDENSTOEL_MAAT;
  const f = Math.min(7, 1 + Math.floor((t - p.start)*GROEI_FPS));
  let a = 0;
  if(p.klaar != null){ const k = t - p.klaar; if(k < 1) a -= 0.12*Math.exp(-6*k)*Math.cos(15*k); }   // 'boing' na het groeien
  if(p.boing != null){ const k = t - p.boing; if(k < 1) a += 0.16*Math.exp(-7*k)*Math.cos(16*k); } // inveren als iemand erop stuitert
  const rw = fh*r.cel/CELL_H, rh = fh*r.celH/CELL_H;
  ctx.save(); ctx.translate(Math.round(p.x), Math.round(p.y) + 1);
  ctx.scale(p.richting*(1 + a*0.5), 1 - a);
  ctx.drawImage(r.img, f*r.cel, 0, r.cel, r.celH, -r.anker*fh/CELL_H, -rh, rw, rh);
  ctx.restore();
}
// de parachute van een o: dichtgevouwen op zijn rug, of open boven zijn hoofd
function tekenParachuteVan(o){
  if(!o.parachute || o.fase === 'dood' || o.fase === 'weg') return;
  const fh = fhVan(o), t = staat.tijd;
  const openImg = objPlaatje('parachute_open'), rugImg = objPlaatje('parachute_rugzak');
  if(o.parachute.open && o.fase === 'vallen' && openImg){
    // de open parachute: het knoopje onderaan zit vast aan de schouders van de o
    const k = Math.min(1, (t - o.parachute.open)/0.25), e = 1 - (1-k)*(1-k);
    const pb = 54*(0.35 + 0.65*e), ph = pb*openImg.naturalHeight/openImg.naturalWidth;
    ctx.save(); ctx.translate(o.x, o.y - fh*0.62); ctx.rotate(Math.sin(t*2.6)*0.07);
    ctx.drawImage(openImg, -pb/2, -ph, pb, ph); ctx.restore(); return;
  }
  if(!o.parachute.open && rugImg){
    // dichtgevouwen: het rugzakje op zijn rug
    const rb = 14, rh = rb*rugImg.naturalHeight/rugImg.naturalWidth;
    ctx.drawImage(rugImg, o.x - o.richting*fh*0.2 - rb/2, o.y - fh*0.62 - rh/2, rb, rh); return;
  }
  if(o.parachute.open && o.fase === 'vallen'){
    const k = Math.min(1, (t - o.parachute.open)/0.25), zwaai = Math.sin(t*2.6)*2;
    const breed = 18 + 26*k, hoog = 6 + 10*k;
    tekenParachuteKoepel(ctx, o.x + zwaai, o.y - fh - 22*k - hoog, breed, hoog, 0, { x: o.x, y: o.y - fh*0.6 });
  } else {
    // dichtgevouwen pakketje op de rug
    ctx.save(); ctx.fillStyle = '#9aa2ac'; ctx.strokeStyle = '#4c5561'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.ellipse(o.x - o.richting*fh*0.22, o.y - fh*0.55, 5, 7, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}
// rand om de oelieboelie onder de muis
function tekenRichtkader(){
  const rb = staat.robyBoorOnderMuis;
  if(rb && rb.fase === 'boren'){

// (v1.48) DE LOEP: INZOOMEN OP HET SPEELVELD (alleen als 'Loep' aanstaat in de molen van het openingsscherm)

// Met de loep aan begint elk level 2 keer zo groot, bij het potlood. Groter/kleiner: de vilten knoppen + en −
// rechtsonder, het muiswieltje, de toetsen + en −, of op de tablet knijpen met twee vingers.
// Rondkijken: slepen/vegen (nu ook omhoog en omlaag), of de pijltjestoetsen. Aan het eind van een level zoomt

  gloed: 'rgba(255,214,60,0.95)', ring: '#ffd83c', water: 'rgba(255,255,255,0.95)', vuur: '#ffe14a' };

function maakContrastVast(k0 = 0, r0 = 0, k1 = level.breed - 1, r1 = LEVEL_HOOGTE - 1){
  if(!level || !vastDoek.width) return;

    else if(s === GROND && mt === MAT_PLANEET) kl = K.planeet; else if(s === GROND && mt === MAT_SNOEP) kl = K.snoep;
    else if(s === MUUR && mt === MAT_CHIP){ kl = K.chip; }
    else if(s === MUUR) kl = K.muur; else if(s === BAKSTEEN) kl = K.baksteen; else if(s === VUUR) kl = K.kolen; else if(s === OBJECT) kl = K.hout;

  const rand = document.createElement('canvas'); rand.width = W; rand.height = H; const r = rand.getContext('2d');
  r.drawImage(vastDoek, X*VAST_SCHAAL, Y*VAST_SCHAAL, W*VAST_SCHAAL, H*VAST_SCHAAL, 0, 0, W, H);

  c.drawImage(vlak, X, Y);

}
// water en vuur extra duidelijk: witte golflijn op het water, knipperende gele vlammenlijn op het vuur
function tekenContrastGevaren(t){
  const camX = camera(), k0 = Math.max(0, Math.floor(camX/BLOK) - 2), k1 = Math.min(level.breed - 1, Math.ceil((camX + beeld.breed)/BLOK) + 2);
  const K = CONTRAST_KLEUR, R = level.raster, B = level.breed;
  ctx.save(); ctx.lineCap = 'round';
  for(let y = 1; y < LEVEL_HOOGTE; y++) for(let x = k0; x <= k1; x++){

      for(let u = 0; u <= BLOK; u += 2){ const px = x*BLOK + u, py = y*BLOK + 1 + Math.sin((px + t*30)*0.5)*1.1; u ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.stroke();

// heldere ring om het potlood of de toverwolk

    if(b.soort === 'pauze') zetPauze(true);   // terug in de editor: het spel staat stil
  });
  window.addEventListener('keydown', e => { if(e.code === 'Escape') window.parent.postMessage({ soort: 'terugNaarEditor' }, '*'); });
}
</script>
</body>
