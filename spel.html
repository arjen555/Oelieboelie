// BEELD: hoe groot alles op het scherm komt en waar we kijken
// =====================================================================
const beeld = { schaal:1, breed:0, hoog:0, boven:0 }; // breed/hoog in spelpixels
function maatAan(){
  const r = doek.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  // onzichtbaar (bijvoorbeeld als de editor het spel even wegzet)? Dan de maat met rust laten.
  if(r.width < 2 || r.height < 2) return;
  beeld.meetB = r.width; beeld.meetH = r.height; beeld.meetDpr = dpr;
  doek.width = Math.round(r.width*dpr); doek.height = Math.round(r.height*dpr);
  // zo groot mogelijk, terwijl de hoogte van het level en één scherm breed altijd passen
  beeld.basis = Math.min(r.height/(LEVEL_HOOGTE*BLOK), r.width/(SCHERM_BREED*BLOK));
  beeld.boven = (r.height/beeld.basis - LEVEL_HOOGTE*BLOK)/2; // lege ruimte boven (en onder) het level, zonder loep
  // (v1.48) loep: alles wordt LOEP.zoom keer zo groot; je kijkt dan naar een stukje van het beeld (staat.camX, staat.camY)
  beeld.schaal = beeld.basis*LOEP.zoom;
  beeld.breed = r.width/beeld.schaal; beeld.hoog = r.height/beeld.schaal;
  beeld.dpr = dpr;
}
window.addEventListener('resize', () => { maatAan(); if(staat){ staat.camX = begrensCamera(staat.camX); staat.camY = begrensCameraY(staat.camY); } });
// Ook als het speelveld van maat verandert zonder dat het venster verandert (bijvoorbeeld omdat de
// knoppenbalk eronder hoger wordt), meteen opnieuw meten. Anders klopt de plek van je muisklik niet meer
// met wat je ziet, en kun je onderin het level (zoals een schimmeldraad) niets meer aanklikken.
if(window.ResizeObserver) new ResizeObserver(() => { maatAan(); if(staat && level){ staat.camX = begrensCamera(staat.camX); staat.camY = begrensCameraY(staat.camY); } }).observe($('speelveld'));
function begrensCameraY(y){   // (v1.48) omhoog/omlaag kijken kan alleen ingezoomd; anders staat het level precies in beeld
  const min = -beeld.boven, max = LEVEL_HOOGTE*BLOK + beeld.boven - beeld.hoog;
  if(!Number.isFinite(y) || max <= min) return min;
  return Math.max(min, Math.min(max, y));
}
function camY(){ return staat && Number.isFinite(staat.camY) ? staat.camY : -beeld.boven; }
function begrensCamera(x){
  if(!Number.isFinite(x)) x = 0;   // nooit een onzinwaarde als kijkpositie
  if(beeld.breed >= level.B) return (level.B - beeld.breed)/2; // level past: in het midden
  return Math.max(0, Math.min(level.B - beeld.breed, x));
}

// =====================================================================
// SPELSTAAT
// =====================================================================
let staat;
function nieuwSpel(){
  latGetrokken.clear();
  gumVraagNr++; $('gumBevestig').classList.remove('zichtbaar'); $('gum').classList.remove('wiebel');   // (v1.46) een open gumvraag vervalt
  verbergOpnieuwVraag();   // (v1.58) een open opnieuw-vraag ook
  staat = {
    fps: BEELDEN_PER_SEC, pas: PASLENGTE,
    voorraad: {...level.typen}, keuze: null, binnenTypen: [],
    pauze: false, tijd: 0, volgendeTekening: 0.6, getekend: 0,
    oelies: [], paddenstoelen: [], stekjes: [], parachutes: [], kussens: [], knallen: [], bommen: [], boems: [], wolkjes: [], krakken: [], vallers: [], stenen: [], kabels: [], steunCheck: true, tekening: null, poef: null, stofjes: [], flitsen: [],
    binnen: 0, af: 0, eindTijd: null, schuifStart: null, vliegStart: null,
    uitspringers: [], uitgesprongen: 0, inBoek: 0, volgendeUitsprong: 0,
    camX: 0, camY: 0
  };
  loepBegin();   // (v1.48) met de loep aan begint elk level ingezoomd
  staat.camX = begrensCamera(level.potlood.x - beeld.breed*0.3);
  staat.camY = begrensCameraY(level.potlood.y - beeld.hoog*0.4);
  zetPauze(false);
  startRondleiding();
  $('uitslag').classList.remove('zichtbaar');
  // tekst alvast (onzichtbaar) invullen, zodat de ruimte voor de uitslag vanaf het begin klopt
  $('geredTxt').textContent = TEKST.gered(level.aantal);
  $('tijdTxt').textContent = TEKST.uitslagRegel(level.nodig, 0);
  $('levelnaam').textContent = TEKST.levelnaam(level.nummer, level.naam);
  vulTitelbord(level.nummer, level.naam);
  // raster kan door Buildy veranderd zijn: opnieuw opbouwen vanuit het levelbestand
  if(levelData){ level = maakLevel(levelData); stempelObjecten(); vernieuwVast(); staat.voorraad = {...level.typen}; }
  // de parachutes die in dit level klaarhangen
  staat.parachutes = level.objecten.filter(o => o.soort === 'parachute').map(o => ({...o, op: false}));
  maakDingZones();
  bouwTypebalk();
}
// ---- rondleiding (v1.2) ----
// Is het level breder dan het scherm, dan laat het spel eerst alles zien: even stil bij het potlood, rustig naar
// de andere kant, even stil, en weer terug. Pas daarna begint het potlood. Een tik, klik of toets slaat hem over.
// Bij 'Opnieuw' van hetzelfde level komt hij niet nog eens.
const RONDLEIDING_WACHT = 0.7;      // stilstaan bij het begin en aan de overkant (seconden)
const RONDLEIDING_PER_SCHERM = 1.5; // zo lang duurt het schuiven per scherm afstand
let rondleidingGezien = null;
function startRondleiding(){
  staat.rondleiding = null;
  const sleutel = level.nummer + '|' + level.naam + '|' + level.B;
  if(rondleidingGezien === sleutel || level.aantal === 0) return;
  staat.rondleiding = { start: null, sleutel };
}
function rondleidingStap(nu){   // nu in seconden (echte tijd, niet de spelsnelheid)
  const r = staat.rondleiding; if(!r) return;
  if(r.start === null){
    if(!beeld.breed) return;                                 // het scherm heeft nog geen maat
    if(level.B <= beeld.breed + BLOK*4){ staat.rondleiding = null; return; }   // past (bijna) op één scherm
    rondleidingGezien = r.sleutel;
    r.begin = begrensCamera(level.potlood.x - beeld.breed*0.3);
    const max = level.B - beeld.breed;
    r.overkant = r.begin < max/2 ? max : 0;                 // meestal naar rechts; staat het potlood rechts, dan naar links
    r.schuif = Math.max(1, Math.abs(r.overkant - r.begin)/beeld.breed*RONDLEIDING_PER_SCHERM);
    r.start = nu;
  }
  const w = RONDLEIDING_WACHT, d = r.schuif, t = nu - r.start;
  const glad = v => v*v*(3 - 2*v);
  let x;
  if(t < w) x = r.begin;
  else if(t < w + d) x = r.begin + (r.overkant - r.begin)*glad((t - w)/d);
  else if(t < 2*w + d) x = r.overkant;
  else if(t < 2*w + 2*d) x = r.overkant + (r.begin - r.overkant)*glad((t - 2*w - d)/d);
  else { stopRondleiding(); return; }
  staat.camX = begrensCamera(x);
}
function stopRondleiding(){
  const r = staat && staat.rondleiding; if(!r) return;
  rondleidingGezien = r.sleutel; staat.camX = begrensCamera(level.potlood.x - beeld.breed*0.3); staat.rondleiding = null;
}
// tijdens de rondleiding: elke tik, klik of toets slaat hem over (en doet verder niets)
window.addEventListener('pointerdown', e => { if(staat && staat.rondleiding){ stopRondleiding(); e.stopPropagation(); e.preventDefault(); } }, true);
window.addEventListener('keydown', e => { if(staat && staat.rondleiding && e.code !== 'Escape'){ stopRondleiding(); e.stopPropagation(); e.preventDefault(); } }, true);
function laadLevel(d){
  if(!d || d.soort !== 'oelieboelie-level' || !Array.isArray(d.raster)) throw new Error(TEKST.geenLevel);
  if(d.hoogte !== LEVEL_HOOGTE) throw new Error(TEKST.oudeMaat);
  levelData = d; level = maakLevel(d); stempelObjecten(); vernieuwVast(); nieuwSpel();
}

// =====================================================================
// HET POTLOOD
// =====================================================================
// waar de voeten van een net getekende oelieboelie staan
function tekenPlek(){ return { x: level.potlood.x, y: level.potlood.y + 6 + FIGUUR_HOOGTE }; }
function omtrekNaarWereld(px, py){
  const fh = FIGUUR_HOOGTE, fw = fh*CELL_W/CELL_H, b = tekenPlek();
  return { x: b.x - fw/2 + px*fw/CELL_W, y: b.y - fh + py*fh/CELL_H };
}
function puntOpOmtrek(v){
  const doel = v*OMTREK_LENGTE[OMTREK_LENGTE.length-1];
  let i = 1; while(i < OMTREK.length-1 && OMTREK_LENGTE[i] < doel) i++;
  const a = OMTREK[i-1], b = OMTREK[i];
  const f = (doel-OMTREK_LENGTE[i-1]) / Math.max(0.001, OMTREK_LENGTE[i]-OMTREK_LENGTE[i-1]);
  return { px: a[0]+(b[0]-a[0])*f, py: a[1]+(b[1]-a[1])*f, i };
}
function potloodPunt(t){
  const tk = staat.tekening; let p;
  if(tk && tk.fase === 'tekenen'){
    const q = puntOpOmtrek(Math.min(1,(t-tk.start)/TEKEN_DUUR));
    p = omtrekNaarWereld(q.px, q.py); p.kanteling = Math.sin(t*2*Math.PI*5)*0.04;
  } else {
    p = omtrekNaarWereld(OMTREK[0][0], OMTREK[0][1]); p.y -= 6; p.kanteling = 0;
  }
  return p;
}
function potloodMidden(p){
  const s = POTLOOD_HOOGTE/POTLOOD_H;
  return { x: p.x + (POTLOOD_W/2 - PUNT_X)*s, y: p.y + (POTLOOD_H/2 - PUNT_Y)*s };
}

// =====================================================================
// DE TOVERWOLK EN DE KAMER
// =====================================================================
function kamerIndeling(){
  const x0 = level.B, bw = SCHUIF_DEEL*beeld.breed;
  // (v1.39) het plaatje heeft een vaste grootte: het staat tussen het uitslagbordje en de onderkant van het speelveld,
  // met KAMER_MARGE ruimte boven en onder. De vloer van de kamer hangt niet meer af van de grond in het level.
  const bovenrand = ($('uitslag').offsetHeight + 14)/beeld.schaal - beeld.boven;
  const ruimteB = bw - 40/beeld.schaal, ruimteH = Math.max(60, level.H - bovenrand);
  const s = Math.min(ruimteB/KAMER_W, ruimteH*(1 - 2*KAMER_MARGE)/KAMER_H);
  const kw = KAMER_W*s, kh = KAMER_H*s;
  const kx = x0 + (bw - kw)/2 + 8/beeld.schaal, ky = bovenrand + (ruimteH - kh)/2;
  const vloerY = ky + kh*0.985;   // de vloer loopt door onder het plaatje
  return { x0, bw, vloerY, s, kw, kh, kx, ky };
}
function wolk(t){
  const deinen = Math.sin(t*2*Math.PI*0.35)*3;
  const b0 = WOLK_BREEDTE, h0 = WOLK_H*b0/WOLK_W;
  let mx = level.wolk.x, my = level.wolk.y, schaal = 1;
  if(staat && staat.vliegStart !== null){
    const k = kamerIndeling(), v = Math.min(1,(t - staat.vliegStart)/VLIEG_DUUR);
    const e = v < 0.5 ? 2*v*v : 1 - Math.pow(-2*v+2,2)/2;
    const doelX = k.kx + WOLKDOEL_X*k.s, doelY = k.ky + WOLKDOEL_Y*k.s;
    const topY = Math.min(my, doelY) - 60;
    mx = mx + (doelX - mx)*e;
    my = (1-e)*(1-e)*my + 2*(1-e)*e*topY + e*e*doelY;
    const eindSchaal = 0.3*k.kw/WOLK_BREEDTE;        // in de kamer: passend bij het plaatje
    schaal = 1 + (eindSchaal - 1)*e;
  }
  const b = b0*schaal, h = h0*schaal, s = b/WOLK_W;
  const x = mx - b/2, y = my - h/2 + deinen;
  return { x, y, b, h, kolkX: x + KOLK_X*s, kolkY: y + KOLK_Y*s };
}

// ingekleurde versies van de oelieboelie (voor de sprong in het boek)
const gekleurd = [];
function maakGekleurd(){
  for(const kleur of KLEUREN){
    const c = document.createElement('canvas'); c.width = CELL_W; c.height = CELL_H;
    const g = c.getContext('2d');
    g.drawImage(loopImg, 3*CELL_W, 0, CELL_W, CELL_H, 0, 0, CELL_W, CELL_H);
    const d = g.getImageData(0,0,CELL_W,CELL_H), p = d.data;
    const kr = parseInt(kleur.slice(1,3),16), kg = parseInt(kleur.slice(3,5),16), kb = parseInt(kleur.slice(5,7),16);
    for(let i=0;i<p.length;i+=4){
      const L = (0.3*p[i] + 0.59*p[i+1] + 0.11*p[i+2])/255;
      const glans = Math.max(0, (L - 0.88)/0.12), f = Math.min(1.1, L*1.15);
      p[i] = Math.min(255, kr*f*(1-glans) + 255*glans);
      p[i+1] = Math.min(255, kg*f*(1-glans) + 255*glans);
      p[i+2] = Math.min(255, kb*f*(1-glans) + 255*glans);
    }
    g.putImageData(d,0,0); gekleurd.push(c);
  }
}

// =====================================================================
// EFFECTJES (fonkels, spetters, roet)
// =====================================================================
function deeltjes(x, y, n, opties){
  for(let i=0;i<n;i++){
    const hoek = (opties.hoek ?? -Math.PI/2) + (Math.random()-0.5)*(opties.spreiding ?? Math.PI*2);
    const v = opties.vMin + Math.random()*(opties.vMax - opties.vMin);
    staat.stofjes.push({ x: x + (Math.random()-0.5)*(opties.breed||0), y,
      vx: Math.cos(hoek)*v, vy: Math.sin(hoek)*v, zw: opties.zw || 0,
      leven: opties.leven + Math.random()*0.4, start: staat.tijd,
      r: opties.r + Math.random()*1.5, fonkel: Math.random() < (opties.fonkel||0),
      kleur: typeof opties.kleur === 'function' ? opties.kleur() : opties.kleur, gloed: opties.gloed !== false });
  }
}
function kleurPlons(x, y){
  staat.flitsen.push({ x, y, start: staat.tijd });
  deeltjes(x, y, 22, { vMin:40, vMax:150, leven:0.5, r:1.3, fonkel:0.4, kleur: () => `hsl(${Math.floor(Math.random()*360)},95%,70%)` });
}

// =====================================================================
// BIJWERKEN
// =====================================================================
function begin(o, fase){ o.fase = fase; o.faseStart = staat.tijd; }
// ---- Spullen in het landschap: omdraaien, opstappen en leeglopen ----
const KIST_STAP = 3;              // op een kist stappen ze vanzelf (3 blokjes: hoger dan een gewone trede)
const HOND_WAAK = 13*BLOK;        // zo dichtbij moet een o komen om de hond wakker te maken
const HOND_SLAAP_NA = 2.5;        // zo lang na de laatste o valt de hond weer in slaap
// het stuk van een ding waar de o's tegenaan lopen (als deel van het vak): links, rechts, bovenkant
const DING_ZONE = { boom:[0.36, 0.62, 0.45], put:[0.1, 0.9, 0.35], hond:[0.12, 0.88, 0.2], cactus:[0.14, 0.88, 0.12] };
let dingZones = [];
function maakDingZones(){
  dingZones = [];
  for(const o of level.objecten){
    const z = (o.soort === 'boom' && BOMEN[o.maat]) ? BOMEN[o.maat].zone : DING_ZONE[o.soort]; if(!z) continue;
    const m = objectMaat(o), x = o.x*BLOK, b = m.b*BLOK, h = m.h*BLOK, y = o.y*BLOK;
    dingZones.push({ x0: x + z[0]*b, x1: x + z[1]*b, y0: y + z[2]*h, y1: y + h, o });
  }
}
// staat een o met zijn voorkant op x en zijn voeten op y in zo'n stuk?
function zoneOp(x, y){
  for(const z of dingZones) if(x > z.x0 && x < z.x1 && y > z.y0 + 2 && y - FIGUUR_HOOGTE < z.y1) return z;
  return null;
}
// de hond: slaapt, schrikt wakker als er een o aankomt, blaft, en valt weer in slaap als het rustig is
// (v1.42) het hondje schrikt wakker van iets anders dan een o (de haak van Hooky): blaffen naar waar het vandaan kwam
function hondSchrik(h, vanX){
  const m = objectMaat(h), cx = (h.x + m.b/2)*BLOK, bodem = (h.y + m.h)*BLOK, t = staat.tijd;
  if(h.wakker == null){ h.wakker = t; deeltjes(cx, bodem - 30, 6, { vMin:15, vMax:45, leven:0.35, r:1, fonkel:0.6, kleur:'rgb(255,215,90)' }); }
  h.gezien = t; h.kijk = vanX < cx ? -1 : 1;
}
function hondStap(h, t){
  const m = objectMaat(h), cx = (h.x + m.b/2)*BLOK, bodem = (h.y + m.h)*BLOK;
  let dichtst = null, d = Infinity;
  for(const o of staat.oelies){
    if(o.fase !== 'lopen' && o.fase !== 'vallen' && o.fase !== 'veren' && o.fase !== 'bouwen' && o.fase !== 'vliegen') continue;
    if(o.y < bodem - 4*BLOK || o.y > bodem + 2*BLOK) continue;   // alleen o's op zijn hoogte
    const a = Math.abs(o.x - cx); if(a < HOND_WAAK && a < d){ d = a; dichtst = o; }
  }
  if(dichtst){
    if(h.wakker == null){ h.wakker = t; deeltjes(cx, bodem - 30, 6, { vMin:15, vMax:45, leven:0.35, r:1, fonkel:0.6, kleur:'rgb(255,215,90)' }); }
    h.gezien = t; h.kijk = dichtst.x < cx ? -1 : 1;
  } else if(h.wakker != null && t - h.gezien > HOND_SLAAP_NA) h.wakker = null;
}
// leeglopen in een cactus (leeglopen.png, 8 beeldjes; voor alle soorten o's dezelfde)
const LEEG_CEL = 93, LEEG_CH = 175, LEEG_ANKER_Y = 164.6, LEEG_SCHAAL = 1/3;
const LEEG_BEELDEN = [0.1, 0.38, 0.22, 0.15, 0.15, 0.15, 0.22];   // hoe lang beeldje 1 t/m 7 blijft staan ("au!" iets langer)
const LEEG_SLAP = LEEG_BEELDEN.reduce((a, b) => a + b, 0);
const LEEG_VLIEG = 1.5;           // daarna fladdert het lege velletje pruttelend weg
const LEEG_DUUR = LEEG_SLAP + LEEG_VLIEG;
function leegStand(o){            // beeldje en plek op dit moment
  const v = staat.tijd - o.faseStart;
  if(v < LEEG_SLAP){ let s = 0, i = 0; while(i < LEEG_BEELDEN.length - 1 && v >= s + LEEG_BEELDEN[i]){ s += LEEG_BEELDEN[i]; i++; } return { beeld: i, x: o.x, y: o.y, draai: 0, alpha: 1 }; }
  const k = Math.min(1, (v - LEEG_SLAP)/LEEG_VLIEG), r = -o.richting;   // weg van de cactus
  return { beeld: 7, vlieg: k,
    x: o.x + r*(k*46) + Math.sin(k*15)*12*(1 - k*0.4),
    y: o.y - 22 - (0.45*k + 0.55*k*k)*190 + Math.sin(k*23)*4,
    draai: Math.sin(k*19)*0.7 + r*k*5,
    alpha: k > 0.7 ? 1 - (k - 0.7)/0.3 : 1 };
}
function leegStapje(o, dt){       // luchtwolkjes: pfffrrrt
  const v = staat.tijd - o.faseStart;
  if(v > LEEG_BEELDEN[0] + LEEG_BEELDEN[1] && Math.random() < dt*14){
    const p = leegStand(o), fh = FIGUUR_HOOGTE;
    deeltjes(p.x - o.richting*(p.vlieg != null ? 2 : fh*0.15), p.y - (p.vlieg != null ? 0 : fh*0.4), 1,
             { hoek: -Math.PI/2, spreiding: 2.5, vMin: 10, vMax: 40, leven: 0.4, r: 1.4, kleur: 'rgba(225,235,250,.9)', gloed: false });
  }
}
function tekenLeeglopen(o){
  const img = objPlaatje('leeglopen'); if(!img) return;
  const p = leegStand(o), k = o.richting;
  ctx.save(); ctx.globalAlpha = Math.max(0, p.alpha);
  if(p.vlieg != null){
    ctx.translate(p.x, p.y); ctx.rotate(p.draai); ctx.scale(-k*LEEG_SCHAAL, LEEG_SCHAAL);   // het velletje fladdert terug, weg van de cactus
    ctx.drawImage(img, 7*LEEG_CEL, 0, LEEG_CEL, LEEG_CH, -LEEG_CEL/2, -LEEG_CH*0.55, LEEG_CEL, LEEG_CH);
  } else {
    ctx.translate(Math.round(p.x), Math.round(p.y) + 1); ctx.scale(k*LEEG_SCHAAL, LEEG_SCHAAL);
    ctx.drawImage(img, p.beeld*LEEG_CEL, 0, LEEG_CEL, LEEG_CH, -LEEG_CEL/2, -LEEG_ANKER_Y, LEEG_CEL, LEEG_CH);
  }
  ctx.restore();
}
// hoogte van het wateroppervlak waar een o in het water belandt
function waterOppervlak(o){
  const cx = Math.floor(o.x/BLOK); let r = Math.round(o.y/BLOK);
  if(blokOp(cx,r) !== WATER) r--;
  if(blokOp(cx,r) !== WATER) return o.y;
  while(blokOp(cx,r-1) === WATER) r--;
  return r*BLOK;
}
// ---- de vlam is heet (v1.1) ----
// Boven het bovenste vuurblokje zit een vlamzone van VLAM_RIJEN blokjes hoog, zo breed als het vuur.
// Wie daar met zijn lijf in komt, gaat roet. De vlam gaat niet door steen, grond, muur of objecten heen,
// wel door de treden van Buildy. Roby vliegt er ongedeerd overheen.
const VLAM_RIJEN = 4;
const VLAM_FASEN = ['lopen','bouwen','glijden','landen','opstappen','veren','eten','krak','aanloop','opblazen','stijgen','opspringen','richten','gooien','haakVliegt','trekken','oprollen','vasthouden'];
function inVlam(bx, by){
  if(bx < 0 || bx >= level.breed || by < 0 || by >= LEVEL_HOOGTE) return false;
  for(let k = 0; k <= VLAM_RIJEN; k++){
    const s = blokOp(bx, by + k);
    if(s === VUUR) return k > 0;                        // het bovenste vuurblokje: binnen bereik
    if(s !== LEEG && s !== BAKSTEEN && vast(bx, by + k)) return false;   // de vlam kan hier niet door
  }
  return false;
}
function lijfInVlam(o){
  if(o.type === 'roby') return false;
  const bx = Math.floor(o.x/BLOK), fh = FIGUUR_HOOGTE*(o.type === 'rocky' ? ROCKY_MAAT : 1);
  for(let y = o.y - 2; y > o.y - fh*0.8; y -= BLOK/2) if(inVlam(bx, Math.floor(y/BLOK))) return true;
  return false;
}
function gaatDood(o, soort){
  begin(o, 'dood'); o.doodSoort = soort; staat.af++; o.vx = 0;
  if(soort === 'plof')  deeltjes(o.x, o.y, 16, { hoek:-Math.PI/2, spreiding:2.6, vMin:30, vMax:110, zw:300, leven:0.4, r:1.2, kleur:'rgb(205,220,240)', gloed:false });
  if(soort === 'plons') o.plonsY = waterOppervlak(o);
  if(soort === 'slinger'){   // door de knal weggeslingerd: draaiend in een boog het beeld uit, met sterretjes
    const r = o.slingerRichting || o.richting;
    o.slVx = r*(110 + Math.random()*70); o.slVy = -(300 + Math.random()*90); o.slDraai = 0; o.slTol = r*(9 + Math.random()*5);
    o.parachute = null; o.richting = r;
  }
  if(soort === 'roet')  deeltjes(o.x, o.y - FIGUUR_HOOGTE*0.5, 22, { hoek:-Math.PI/2, spreiding:1.2, vMin:15, vMax:60, leven:0.9, r:2.2, kleur:'rgb(55,55,60)', gloed:false, breed:20 });
}

// omdraaien; we onthouden waar, zodat het trapje dat hij daar meteen afstapt niet telt als 'afdalen'
const TRAP_GEHEUGEN = 2;   // zo vaak omdraaien blijft een o onthouden dat hij een trap al op is geweest
function draaiOm(o){
  // vlak voor de muur nog een trapje af gestapt (de laatste trede van een trap)? Dat telt niet: hij blijft wat hij was.
  if(o.stapX != null && Math.abs(o.x - o.stapX) < 3*BLOK) o.daalt = o.daaltVoor;
  // ...en ook niet: vlak voor de muur nog een halve trede óp gestapt (het stukje trap dat Buildy tegen de muur legt).
  // Zonder deze regel vergat een dalende o daar dat hij aan het afdalen was, en klom hij steeds weer dezelfde trap op.
  if(o.opX != null && Math.abs(o.x - o.opX) < 3*BLOK) o.daalt = o.daaltVoorOp;
  // (v1.54) op ijs: eerst nog even doorglijden (remmen), pas daarna omdraaien
  if(!o.ijsDraai && o.fase === 'lopen' && isIjs(Math.floor(o.x/BLOK), Math.round(o.y/BLOK))){ o.ijsRem = staat.tijd + IJS_REM; o.ijsRemStart = o.faseStart; return; }
  o.richting *= -1; o.draaiX = o.x; o.stapX = null; o.opX = null;
  o.keren = (o.keren || 0) + 1;   // telt hoe vaak hij omgedraaid is (voor het onthouden van trappen)
}
function loopStap(o, dt, snelheid){
  // tegen een boom, put of hond: omdraaien. In een cactus: au!
  const voor = o.richting*FIGUUR_HOOGTE*0.22, stap = o.richting*snelheid*dt, zn = zoneOp(o.x + stap + voor, o.y);
  if(zn && !zoneOp(o.x + voor, o.y)){
    if(zn.o.soort === 'cactus'){ o.x += stap; gaatDood(o, 'leeglopen'); } else draaiOm(o);
    return;
  }
  const cx = Math.floor(o.x/BLOK), voetRij = Math.round(o.y/BLOK);
  const nx = o.x + o.richting*snelheid*dt, ncx = Math.floor(nx/BLOK);
  if(ncx !== cx){
    // Op een zigzag van Buildy-trappen: wie aan het afdalen is, daalt door tot beneden,
    // en wie aan het klimmen is, klimt door tot boven. Op een kruispunt van twee trappen
    // (omhoog én omlaag mogelijk) kiest een dalende o dus de trap omlaag en loopt hij
    // door de opgaande trede heen.
    const omlaagMogelijk = !vast(ncx, voetRij) && (blokOp(ncx, voetRij+1) === BAKSTEEN ||
                           (!vast(ncx, voetRij+1) && blokOp(ncx, voetRij+2) === BAKSTEEN));   // alleen een trede omlaag telt
    const trapOmhoog = blokOp(ncx, voetRij-1) === BAKSTEEN && !muur(ncx, voetRij-1);
    // ...ook als de trap omlaag pas één stap verder begint: dan loopt hij eerst vlak door, door de opgaande trede heen
    const n2 = ncx + o.richting;
    const omlaagDaarna = blokOp(ncx, voetRij) === BAKSTEEN && !vast(n2, voetRij) && (blokOp(n2, voetRij+1) === BAKSTEEN ||
                         (!vast(n2, voetRij+1) && blokOp(n2, voetRij+2) === BAKSTEEN));
    // Een trap omhoog waar hij nog niet op is geweest, loopt hij op (ook als hij net een paar treden afdaalde).
    // Is hij die trap al eens op geweest, dan neemt hij de weg omlaag: zo loopt niemand eindeloos heen en weer.
    const trapOp = trapOmhoog ? level.trapVan.get((voetRij-1)*level.breed + ncx) : undefined;
    // (telt alleen als dat was vóór zijn laatste keer omdraaien: de trap waar hij nu op klimt, telt nog niet)
    // (v1.4) Het onthouden verloopt na TRAP_GEHEUGEN keer omdraaien: is er intussen iets veranderd (een nieuwe trap
    // erboven, een opgeblazen muur), dan probeert hij het later toch weer.
    const keer = trapOp !== undefined && o.beklommen && o.beklommen.has(trapOp) ? o.beklommen.get(trapOp) : null;
    const alGeweest = trapOp !== undefined ? (keer !== null && keer < (o.keren || 0) && (o.keren || 0) - keer <= TRAP_GEHEUGEN) : o.daalt;
    if(alGeweest && trapOmhoog && (omlaagMogelijk || omlaagDaarna)){
      o.x = nx;
      if(omlaagMogelijk) o.y += (vast(ncx, voetRij+1) ? 1 : 2)*BLOK;
      return;
    }
    // (v1.4) Al op geweest en hier geen trap omlaag, maar de vloer loopt gewoon door? Dan loopt hij onder de trap door
    // in plaats van er weer op te klimmen. Zo komt hij bij de volgende afslag (bijv. een trap omlaag) in plaats van te pendelen.
    if(alGeweest && trapOmhoog && trapOp !== undefined && vast(ncx, voetRij)){
      let vrij = true;
      for(let r = voetRij - 1; r > voetRij - 6 - hoofdExtra(o); r--) if(muur(ncx, r)){ vrij = false; break; }
      if(vrij){ o.x = nx; return; }
    }
    // het lage uiteinde van een flauw gekantelde balk (Bomby): daar stappen ze op, ook als het boven een kuiltje hangt
    { let r = voetRij - 1, schuin = null;
      for(; r >= voetRij - 5; r--){ const ob = objectOp(ncx, r); if(ob && ob.soort === 'schuin' && !ob.steil){ schuin = ob; break; } }
      if(schuin){
        let top = r; while(top > 0 && vast(ncx, top - 1)) top--;
        let ruimte = true; for(let rr = top - 1; rr > top - 6; rr--) if(muur(ncx, rr)) { ruimte = false; break; }
        if(voetRij - top <= SCHUIN_STAP + 1 && ruimte){ o.y = top*BLOK; o.x = nx; o.daalt = false; o.stapX = null; return; }
      } }
    if(vast(ncx, voetRij-1)){
      // een steile helling is te steil om op te lopen: omdraaien
      for(let r = voetRij-1; r >= voetRij-1-MAX_STAP; r--) if(steileHelling(ncx, r)){ draaiOm(o); return; }
      // er staat iets voor de voeten: hoe hoog is het?
      // op een kist mag de stap iets hoger zijn
      // op een kist, of op het lage uiteinde van een gekantelde balk, mag de stap iets hoger zijn
      const kistje = objectOp(ncx, voetRij-1), schuin = [1,2,3,4].map(d => objectOp(ncx, voetRij-d)).find(o => o && o.soort === 'schuin' && !o.steil);
      const maxStap = (kistje && kistje.soort === 'kist') ? KIST_STAP : schuin ? SCHUIN_STAP : MAX_STAP;
      let h = 0; while(h <= maxStap && vast(ncx, voetRij-1-h)) h++;
      // past hij er ook onder door (hoofdruimte)?
      let ruimte = true;
      for(let r = voetRij-1-h; r > voetRij-1-h-5-hoofdExtra(o); r--) if(muur(ncx, r)) { ruimte = false; break; }
      if(h <= maxStap && ruimte){ o.daaltVoorOp = o.daalt; o.opX = nx; o.y -= h*BLOK; o.x = nx; o.daalt = false; o.stapX = null;
        // op een trede van Buildy gestapt, en die trap loopt in zijn looprichting omhoog: deze trap onthouden
        // (alleen even over het onderste stukje van een andere trap heen stappen telt niet)
        const trap = level.trapVan.get((voetRij-h)*level.breed + ncx);
        if(trap !== undefined && level.trapKant.get(trap) === o.richting) { o.beklommen = o.beklommen || new Map(); if(!o.beklommen.has(trap)) o.beklommen.set(trap, o.keren || 0); } }
      else draaiOm(o);                          // te hoog: een muur, dus omdraaien
      return;
    }
    // hoofd tegen een overhang?
    for(let r = voetRij-2; r > voetRij-6-hoofdExtra(o); r--) if(muur(ncx, r)) { draaiOm(o); return; }
    // over de rand van een steile helling, in de richting waarin hij afloopt: glijden!
    for(let r = voetRij; r <= voetRij+3; r++){
      if(!vast(ncx, r)) continue;
      const hl = steileHelling(ncx, r);
      if(hl && -hl.richting === o.richting && !gangOp(ncx, r-1)){ o.x = nx; startGlijden(o, hl); return; }
      break;
    }
    o.x = nx;
    if(!vast(ncx, voetRij)){
      // geen grond meer: een trapje af, of vallen
      // net omgedraaid en meteen een trapje af (de laatste trede van een trap tegen de muur)?
      // Dan blijft hij wat hij was: een klimmer klimt daarna de volgende trap op, een daler daalt verder.
      const netGedraaid = o.draaiX != null && Math.abs(o.x - o.draaiX) < 3*BLOK;
      if(vast(ncx, voetRij+1) || vast(ncx, voetRij+2)){
        o.daaltVoor = o.daalt; o.stapX = nx;
        o.y += (vast(ncx, voetRij+1) ? 1 : 2)*BLOK;
        if(!netGedraaid) o.daalt = true;
      }
      else { begin(o,'vallen'); o.vy = 0; o.vx = 0; o.valStart = o.y; }
    }
  } else o.x = nx;
  // weer op gewone grond (geen trede van Buildy)? Dan vergeet hij welke trappen hij op is geweest
  // (v1.4) Vroeger vergat hij hier op gewone grond welke trappen hij op was geweest. Daardoor pendelden o's eindeloos
  // tussen trappen met een stukje muur of vloer ertussen. Nu verloopt het onthouden vanzelf (TRAP_GEHEUGEN).
  // in water of vuur gelopen?
  const s = blokOp(Math.floor(o.x/BLOK), Math.round(o.y/BLOK)-1);
  if(s === WATER) gaatDood(o,'plons');
  if(s === VUUR) gaatDood(o,'roet');
}

function valStap(o, dt){
  // uit de geknapte ballon valt Balloony trager: twee keer zo lang onderweg (zwaartekracht /4, topsnelheid /2)
  const tr = o.uitBallon ? BALLON_UIT_TRAAG : 1;
  o.vy = Math.min(MAX_VALSNELHEID/tr, o.vy + ZWAARTEKRACHT/(tr*tr)*dt);
  // met een parachute: zodra hij naar beneden gaat, klapt de parachute open en zweeft hij langzaam
  if(o.parachute && o.vy > 0){
    if(!o.parachute.open){ o.parachute.open = staat.tijd; deeltjes(o.x, o.y - FIGUUR_HOOGTE - 20, 8, { vMin:15, vMax:50, leven:0.4, r:1, fonkel:0.5, kleur:'rgb(235,240,248)' }); }
    o.vy = Math.min(o.vy, PARACHUTE_VALSNELHEID); o.vx *= 0.97;
  }
  // zijwaarts (na het wegkaatsen van een paddenstoel)
  if(o.vx){
    const nx = o.x + o.vx*dt, oud = Math.floor(o.x/BLOK), nieuw = Math.floor(nx/BLOK);
    let bots = false;
    if(nieuw !== oud) for(let r = Math.floor((o.y-1)/BLOK); r >= Math.floor((o.y - FIGUUR_HOOGTE + 2)/BLOK); r--) if(vast(nieuw, r)) { bots = true; break; }
    // Raakt hij alleen met zijn voeten een lage rand (een trede van hoogstens MAX_STAP blokjes, met ruimte erboven),
    // dan stapt hij erop en gaat hij gewoon verder, net als bij lopen (sinds v0.98).
    if(bots){
      const voetRij = Math.floor((o.y - 1)/BLOK);
      let top = voetRij; while(top > voetRij - MAX_STAP && vast(nieuw, top - 1)) top--;
      let trede = vast(nieuw, voetRij) && !vast(nieuw, top - 1) && o.y - top*BLOK <= MAX_STAP*BLOK + 1;
      if(trede) for(let r = top - 1; r >= Math.floor((top*BLOK - FIGUUR_HOOGTE + 2)/BLOK); r--) if(vast(nieuw, r) || vast(oud, r)){ trede = false; break; }
      if(trede){ o.x = nx; o.y = top*BLOK - 0.01; if(o.vy > 0) o.vy = 0; bots = false; }   // net boven de trede, zodat hij er hieronder meteen op landt
    }
    if(bots){ o.vx = 0; o.richting *= -1; }   // tegen een echte wand gekaatst: omdraaien, zodat hij bij de volgende kaats de andere kant op gaat
    else if(o.x !== nx) o.x = nx;
  }
  let ny = o.y + o.vy*dt;
  if(o.vy < 0){
    // omhoog: niet door het plafond, en het hoogste punt onthouden
    if(vast(Math.floor(o.x/BLOK), Math.floor((ny - FIGUUR_HOOGTE)/BLOK))){ o.vy = 0; ny = o.y; }
    o.valStart = ny;
  } else {
    // landen op de hoed van een paddenstoel: wegkaatsen
    for(const p of staat.paddenstoelen){
      if(p.klaar == null) continue;
      const top = p.y - HOED_TOP;
      if(o.y <= top && ny >= top && Math.abs(o.x - p.x) < HOED_HALF){ o.y = top; kaats(o, p); return; }
    }
  }
  const cx = Math.floor(o.x/BLOK);
  // alle bloklijnen die hij in deze stap passeert
  for(let r = Math.floor(o.y/BLOK)+1; r*BLOK <= ny; r++){
    const s = blokOp(cx, r);
    if(s === WATER){ o.y = r*BLOK; gaatDood(o,'plons'); return; }
    if(s === VUUR){ o.y = r*BLOK; gaatDood(o,'roet'); return; }
    if(vast(cx, r)){
      o.y = r*BLOK;
      if(o.parachute){   // veilig geland: de parachute is op
        deeltjes(o.x, o.y - FIGUUR_HOOGTE - 14, 12, { hoek:-Math.PI/2, spreiding:2.4, vMin:20, vMax:60, leven:0.5, r:1.3, kleur:'rgb(200,208,218)', gloed:false, breed:30 });
        o.parachute = null; o.valStart = o.y;
      }
      // op een kussen geland: zacht, wat de hoogte ook was
      const kus = kussenOnder(o.x, o.y);
      if(kus){ kus.boing = staat.tijd; o.valStart = o.y;
        deeltjes(o.x, o.y - 6, 8, { hoek:-Math.PI/2, spreiding:2.4, vMin:20, vMax:60, leven:0.4, r:1, fonkel:0.5, kleur:'rgb(255,220,150)' });
        // zacht neerkomen: even wegzakken in het kussen en twee keer opveren, daarna verder lopen
        begin(o,'veren'); o.vx = 0; o.vy = 0; o.uitBallon = false; o.veerKussen = kus; o.veer2 = false;
        return; }
      // (v1.54) veerkrachtige planeetbodem: wie er van een flinke hoogte op valt, stuitert zacht op (nooit een smak)
      if(isPlaneet(cx, r) && o.y - o.valStart > STUITER_MIN){
        const h = o.y - o.valStart;
        o.uitBallon = false; o.y = r*BLOK - 0.01; o.vy = -Math.sqrt(2*ZWAARTEKRACHT*h)*STUITER; o.valStart = o.y;
        deeltjes(o.x, o.y - 2, 7, { hoek: -Math.PI/2, spreiding: 2.6, vMin: 20, vMax: 70, leven: 0.4, r: 1, fonkel: 0.6, kleur: () => Math.random() < 0.5 ? 'rgb(255,170,250)' : 'rgb(200,255,120)' });
        return;
      }
      if(o.y - o.valStart > MAX_VAL) gaatDood(o, o.type === 'balloony' ? 'pletter' : 'plof');
      else if(steileHelling(cx, r) && !gangOp(cx, r-1)) startGlijden(o, steileHelling(cx, r));
      else { begin(o,'lopen'); o.frame = 0; o.frameTijd = 0; o.vx = 0; }
      o.uitBallon = false;
      return;
    }
  }
  o.y = ny;
  if(o.y > level.H + 60){ begin(o,'weg'); staat.af++; } // uit het level gevallen
}

// ---- Steile helling: naar beneden glijden ----
function startGlijden(o, hl){
  begin(o,'glijden'); o.uitBallon = false; o.helling = hl; o.richting = -hl.richting; o.daalt = false; o.vx = 0;
  o.y = hellingOppervlak(hl, o.x);
}
function glijStap(o, dt){
  const hl = o.helling, m = objectMaat(hl), x0 = hl.x*BLOK, x1 = (hl.x + m.b)*BLOK;
  o.x += o.richting*GLIJ_SNELHEID*dt;
  if(Math.random() < dt*30) deeltjes(o.x, o.y, 1, { hoek:-Math.PI/2 - o.richting*0.8, spreiding:0.8, vMin:20, vMax:60, zw:250, leven:0.3, r:0.9, kleur:'rgb(200,205,212)', gloed:false });
  if(o.richting < 0 ? o.x <= x0 : o.x >= x1){
    // onderaan de helling: heelhuids neerkomen en verder lopen (of verder vallen als daar niets is)
    o.y = (hl.y + m.h)*BLOK;
    // (v1.8) de onderkant van een gekantelde plank kan net ín iets eronder liggen (bijv. de plank waar hij op rust):
    // dan komt hij bovenop dat ding neer in plaats van erin (en er daarna doorheen te vallen)
    { const kol = Math.floor(o.x/BLOK); let n = 0; while(n < 4 && vast(kol, Math.floor((o.y - 1)/BLOK))){ o.y = Math.floor((o.y - 1)/BLOK)*BLOK; n++; } }
    // sluit hier meteen een volgende steile helling aan die dezelfde kant op afloopt? Dan glijdt hij gewoon door
    const kol = Math.floor(o.x/BLOK), voetRij = Math.round(o.y/BLOK);
    for(const c of [kol, kol + o.richting]) for(let r = voetRij - 1; r <= voetRij + 3; r++){
      const h2 = steileHelling(c, r);
      if(h2 && h2 !== hl && -h2.richting === o.richting && !gangOp(c, r-1)){ startGlijden(o, h2); return; }
    }
    if(vast(Math.floor(o.x/BLOK), Math.round(o.y/BLOK))){ begin(o,'lopen'); o.frame = 0; o.frameTijd = 0; }
    else { begin(o,'vallen'); o.vy = 60; o.vx = o.richting*60; o.valStart = o.y; }
    return;
  }
  o.y = hellingOppervlak(hl, o.x);
}
// ---- Parachute: de eerste o die erdoorheen loopt (of valt), neemt hem mee ----
function pakParachute(o){
  if(o.parachute) return;
  const fh = FIGUUR_HOOGTE;
  for(const p of staat.parachutes){
    if(p.op) continue;
    const m = objectMaat(p), x0 = p.x*BLOK, y0 = p.y*BLOK;
    if(o.x > x0 - fh*0.25 && o.x < x0 + m.b*BLOK + fh*0.25 && o.y > y0 && o.y - fh < y0 + m.h*BLOK){
      p.op = true; o.parachute = { open: null };
      deeltjes(x0 + m.b*BLOK/2, y0 + m.h*BLOK/2, 14, { vMin:20, vMax:80, leven:0.45, r:1.1, fonkel:0.6, kleur:'rgb(235,240,248)' });
      return;
    }
  }
}

// ---- Buildy ----
// Waar de volgende steen komt en waar Buildy daarna staat. null = kan niet (muur, plafond, rand).
function volgendeSteen(o){
  const cx = Math.floor(o.x/BLOK), rij = Math.round(o.y/BLOK) - 1, d = o.richting;
  const kolommen = [];
  for(let i=1;i<=STEEN_BREED;i++){
    const k = cx + d*i;
    if(k < 0 || k >= level.breed || vast(k, rij) || rij < 1) break;   // hier zit iets in de weg
    if(zoneOp((k + 0.5)*BLOK, rij*BLOK) && !zoneOp(o.x, o.y)) break;  // een boom, put, hond of cactus
    kolommen.push(k);
  }
  // geen enkel vakje vrij: niet bouwen. Wel 1 vakje vrij (vlak voor een muur): een halve trede,
  // zodat de trap altijd netjes tegen de muur aansluit, waar Buildy ook begonnen is.
  if(!kolommen.length) return null;
  // past Buildy erop, met zijn hoofd vrij?
  const nieuwX = o.x + d*kolommen.length*BLOK, nk = Math.floor(nieuwX/BLOK);
  for(let r = rij-1; r >= rij-6; r--) if(vast(nk, r) || vast(cx + d, r)) return null;
  return { kolommen, rij, nieuwX, nieuwY: rij*BLOK };
}
const BUILDY_MAX_TREDEN = 15;   // zoveel treden legt één Buildy hoogstens (een halve trede bij een muur telt ook als één)
const BOUW_PROBEER = 1.5;   // zo lang blijft een nieuwe Buildy proberen te gaan bouwen als het niet meteen kan
function stopBouwen(o, omdraaien){
  begin(o,'lopen'); o.frame = 0; o.frameTijd = 0;
  if(omdraaien) o.richting *= -1;
}
function bouwStap(o, dt, per){
  o.frameTijd += dt;
  while(o.frameTijd >= per){
    o.frameTijd -= per;
    o.frame++;
    if(o.frame === STEEN_LEG_BEELD){
      // de steen neerleggen
      const s = volgendeSteen(o);
      if(!s){ stopBouwen(o, true); return; }
      for(const k of s.kolommen){ level.raster[s.rij*level.breed + k] = BAKSTEEN; level.trapVan.set(s.rij*level.breed + k, o.trapId); tekenVastBlok(k, s.rij, BAKSTEEN); }
      if(CONTRAST.aan) maakContrastVast(Math.min(...s.kolommen) - 1, s.rij - 1, Math.max(...s.kolommen) + 1, s.rij + 1);   // (v1.50) ook de nieuwe traptree in hoog contrast
      o.steen = s; o.treden = (o.treden || 0) + 1; if(!level.trapKant.has(o.trapId)) level.trapKant.set(o.trapId, o.richting);   // naar welke kant deze trap omhoog loopt
      deeltjes((s.kolommen[0]+s.kolommen[s.kolommen.length-1]+1)*BLOK/2, s.rij*BLOK, 5, { hoek:-Math.PI/2, spreiding:2, vMin:15, vMax:45, zw:200, leven:0.3, r:0.8, kleur:'rgb(220,190,160)', gloed:false });
    }
    if(o.frame >= LOOP_FRAMES){
      // de reeks is rond: op de nieuwe steen stappen
      o.frame = 0;
      if(o.steen){ o.x = o.steen.nieuwX; o.y = o.steen.nieuwY; o.steen = null; }
      // op: na de laatste trede loopt hij gewoon rechtdoor verder (is daar niets, dan valt hij)
      if(o.treden >= BUILDY_MAX_TREDEN){ stopBouwen(o, false); return; }
      if(!volgendeSteen(o)){ stopBouwen(o, true); return; }
    }
  }
}
// ---- Fungy ----
// Zachte grond voor Fungy: gewone zachte grond, en ook een helling (die is van dezelfde grond gemaakt).
function zacht(bx, by){
  const s = blokOp(bx, by);
  if(s === GROND) return true;
  if(s !== OBJECT) return false;
  const o = objectOp(bx, by); return !!(o && o.soort === 'helling');
}
// kan Fungy hier de grond in? (alleen zachte grond, een helling telt mee)
function kanDuiken(o){
  const cx = Math.floor(o.x/BLOK), r = Math.round(o.y/BLOK);
  for(let d=0; d<=DRAAD_DIEPTE; d++) if(!zacht(cx, r+d)) return false;
  return true;
}
// de helling onder Fungy's voeten (of null)
function hellingOnder(o){
  const hl = objectOp(Math.floor(o.x/BLOK), Math.round(o.y/BLOK));
  return (hl && hl.soort === 'helling') ? hl : null;
}
function startDuiken(o){
  // op een helling: eerst de voeten netjes op het schuine vlak, zoals je hem zag lopen
  const hl = hellingOnder(o);
  if(hl){ const hy = hellingOppervlak(hl, o.x); if(Math.abs(hy - o.y) < BLOK*1.5) o.y = hy; }
  begin(o,'duiken'); o.frame = 0; o.frameTijd = 0; o.grondY = o.y; o.zakStart = null;
}
function duikStap(o, dt){
  const t = staat.tijd;
  if(o.zakStart === null){
    // eerst de sprong en de halve draai (beeldje 0 t/m 3)
    o.frame = Math.floor((t - o.faseStart)*DUIK_FPS);
    if(o.frame >= 4){ o.frame = 4; o.zakStart = t;
      deeltjes(o.x, o.grondY, 10, { hoek:-Math.PI/2, spreiding:2.2, vMin:30, vMax:90, zw:350, leven:0.35, r:1.1, kleur:'rgb(150,100,60)', gloed:false, breed:14 });
    }
    return;
  }
  // daarna ondersteboven de grond in boren (beeldje 4 t/m 7 herhalen)
  o.frame = 4 + Math.floor((t - o.zakStart)*14) % 4;
  if(Math.random() < dt*25) deeltjes(o.x, o.grondY, 1, { hoek:-Math.PI/2, spreiding:2.4, vMin:30, vMax:80, zw:350, leven:0.3, r:1, kleur:'rgb(150,100,60)', gloed:false, breed:10 });
  if(t - o.zakStart >= ZAK_DUUR){
    begin(o,'draad');
    o.stekje = { x: o.x, y: o.grondY, richting: o.richting, start: t, weg: null };
    staat.stekjes.push(o.stekje);
    // De draad onthoudt de weg die hij aflegt: om de 2 spelpixels een punt.
    // v = true betekent: dit punt hoort bij een stuk dat recht naar beneden gaat (daar kun je niet klikken).
    o.draad = { pad: [{ x: o.x, y: o.grondY, v: false }], lengte: 0, modus: 'begin', richting: o.richting };
  }
}

// ---- De weg van de schimmeldraad ----
// De draad volgt de zachte grond:
//  - hij duikt eerst de grond in, tot DRAAD_DIEPTE blokjes onder het oppervlak;
//  - loopt de grond omhoog (een helling of trapje op), dan buigt hij geleidelijk mee omhoog, net onder het oppervlak (sinds v0.95);
//  - loopt de grond omlaag (een helling af, of een trapje), dan groeit hij schuin mee, net onder het oppervlak;
//  - komt hij bij een steile rand met lucht ervoor, dan gaat hij binnen de grond recht naar beneden,
//    tot hij naast de grond aan de andere kant op diepte is, en groeit daar weer verder;
//  - (v1.34) loopt de grond steil omhoog (steiler dan DRAAD_MAX_STIJG), dan klimt hij binnen de grond recht omhoog,
//    langs de rand, tot hij vlak onder de top weer op diepte is, en groeit daar weer verder (daar kun je niet klikken);
//  - houdt de zachte grond op (een afgrond, steen, water...), dan loopt hij dood.
const DRAAD_KLIM = BLOK*1.5;                  // (v1.34) ligt het oppervlak boven de draad zoveel hoger dan zijn diepte: recht omhoog klimmen
const DRAAD_STAP = 2;                         // afstand tussen twee punten van de draad
const DRAAD_BUIG = 18;                        // zo lang duurt het duiken naar diepte
const DRAAD_DIEPTE_PX = DRAAD_DIEPTE*BLOK + BLOK/2;
const DRAAD_RAND = 3;                         // zo ver voor de rand maakt de draad de hoek naar beneden
const DRAAD_MAX_HELLING = 3;                  // steiler dan dit groeit de draad niet schuin (naar beneden)
const DRAAD_MAX_STIJG = 1;                    // steiler dan dit groeit de draad niet omhoog (1 = 45 graden)
const DRAAD_VOORUIT = 1;                      // zoveel blokjes kijkt de draad vooruit om op tijd omhoog te buigen
const DRAAD_MIN_DIEPTE = BLOK*1.5;                // minstens zo diep blijft de draad onder het oppervlak
// het oppervlak boven de draad, in kolom bx (zoekend vanaf rij r omhoog door de zachte grond)
function oppervlakBoven(bx, r, x){
  let top = r;
  while(top > 0 && zacht(bx, top - 1)) top--;
  const o = objectOp(bx, top);
  if(o && o.soort === 'helling'){
    const hy = hellingOppervlak(o, x);
    if(hy > (top - 1)*BLOK && hy < (top + 1)*BLOK) return hy;
  }
  return top*BLOK;
}
// het volgende punt van de draad maken; false = de draad loopt dood
function groeiDraad(d){
  const kop = d.pad[d.pad.length - 1], dir = d.richting, start = d.pad[0];
  // 1. het duiken: van het oppervlak zacht naar diepte
  if(d.modus === 'begin'){
    const u = d.pad.length*DRAAD_STAP, k = Math.min(1, u/DRAAD_BUIG), e = k*k*(3 - 2*k);
    const x = start.x + dir*u;
    // (v1.44) op een steile helling zakt de grond sneller weg dan de duikboog: dan de grond volgen,
    // zodat de draad niet boven de grond uitkomt (eerder liep hij daar meteen dood)
    const bx = Math.floor(x/BLOK); let rr = Math.floor(start.y/BLOK);
    while(rr < LEVEL_HOOGTE && !zacht(bx, rr)) rr++;
    const op = rr < LEVEL_HOOGTE ? oppervlakBoven(bx, rr, x) : start.y;
    d.pad.push({ x, y: Math.max(start.y + DRAAD_DIEPTE_PX*e, op + DRAAD_DIEPTE_PX*e), v: false });
    if(k >= 1) d.modus = 'groei';
    return true;
  }
  // 2. naar beneden, langs de binnenkant van een (grillige) steile rand
  if(d.modus === 'omlaag'){
    const kol = Math.floor(kop.x/BLOK);
    const ny = kop.y + DRAAD_STAP, r = Math.floor(ny/BLOK);
    if(ny >= level.H) return false;
    // waar is de rand in deze rij? zoek vanaf de draad in de groeirichting de eerste plek zonder zachte grond
    let rand = null;
    if(zacht(kol, r)){
      for(let i = 1; i <= 6; i++) if(!zacht(kol + dir*i, r)){ rand = kol + dir*i; break; }
    } else {
      // onder de draad zit lucht: de grond springt terug. Dan kruipt de draad langs de onderkant
      // van de grond opzij (terug, tegen de groeirichting in), zo ver als nodig, tot er weer grond
      // onder hem is en hij verder naar beneden kan. Houdt de zachte grond opzij op (steen, lucht), dan loopt hij dood.
      const zx = kop.x - dir*DRAAD_STAP;
      if(zacht(Math.floor(zx/BLOK), Math.floor(kop.y/BLOK))){ d.pad.push({ x: zx, y: kop.y, v: true }); return true; }
      return false;
    }
    // geen rand meer vlak voor de draad, en verderop ligt grond op diepte? dan is hij beneden: de hoek om, weer verder
    const verder = kol + dir*3;
    if(rand === null && zacht(verder, r) && ny >= oppervlakBoven(verder, r, verder*BLOK + BLOK/2) + DRAAD_DIEPTE_PX){
      d.pad.push({ x: kop.x, y: ny, v: false });
      d.modus = 'groei'; d.terug = 0;
      return true;
    }
    if(rand === null){
      // nog geen grond verderop: gewoon recht naar beneden, zolang er grond is
      if(!zacht(kol, r)) return false;
      d.pad.push({ x: kop.x, y: ny, v: true }); d.terug = 0;
      return true;
    }
    // de draad blijft op een vaste afstand binnen de rand, en schuift dus mee als de rand grillig is
    const randX = dir > 0 ? rand*BLOK : (rand + 1)*BLOK;
    const doelX = randX - dir*(DRAAD_RAND + BLOK/2);
    const dx = Math.max(-2*DRAAD_STAP, Math.min(2*DRAAD_STAP, doelX - kop.x));
    const len = Math.hypot(dx, DRAAD_STAP);
    const p = { x: kop.x + dx*DRAAD_STAP/len, y: kop.y + DRAAD_STAP*DRAAD_STAP/len, v: true };
    if(zacht(Math.floor(p.x/BLOK), Math.floor(p.y/BLOK))){ d.pad.push(p); d.terug = 0; return true; }
    // onder de draad geen grond, maar ernaast wel (de rand springt terug): eerst een stukje opzij
    const zx = kop.x + Math.sign(dx || -dir)*DRAAD_STAP;
    if((d.terug || 0) < 16 && zacht(Math.floor(zx/BLOK), Math.floor(kop.y/BLOK))){
      d.pad.push({ x: zx, y: kop.y, v: true }); d.terug = (d.terug || 0) + 1;
      return true;
    }
    return false;                                             // echt geen grond meer: een afgrond
  }
  // 2b. (v1.34) recht omhoog, langs de binnenkant van een steile helling of heuvelwand (de lucht zit achter de draad)
  if(d.modus === 'omhoog'){
    const kol = Math.floor(kop.x/BLOK);
    const ny = kop.y - DRAAD_STAP, r = Math.floor(ny/BLOK);
    // al vlak onder de top, op de gewone diepte? dan de hoek om en weer verder groeien
    if(ny < oppervlakBoven(kol, Math.floor(kop.y/BLOK), kop.x) + DRAAD_DIEPTE_PX || ny <= 0){
      d.modus = 'groei'; d.geenKlim = d.pad.length; d.pad[d.pad.length - 1].v = false;
      return groeiDraad(d);
    }
    // de wand achter de draad: blijf op een vaste afstand binnen de rand, ook als die grillig is
    let wand = null;
    for(let i = 0; i <= 6; i++) if(!zacht(kol - dir*i, r)){ wand = kol - dir*i; break; }
    let x = kop.x;
    if(wand !== null){
      const wandX = dir > 0 ? (wand + 1)*BLOK : wand*BLOK;
      const doelX = wandX + dir*(DRAAD_RAND + BLOK/2);
      x = kop.x + Math.max(-2*DRAAD_STAP, Math.min(2*DRAAD_STAP, doelX - kop.x));
    }
    const len = Math.hypot(x - kop.x, DRAAD_STAP);
    const p = { x: kop.x + (x - kop.x)*DRAAD_STAP/len, y: kop.y - DRAAD_STAP*DRAAD_STAP/len, v: true };
    if(zacht(Math.floor(p.x/BLOK), Math.floor(p.y/BLOK))){ d.pad.push(p); return true; }
    // boven de draad geen zachte grond (steen, of een overhang): niet verder klimmen, gewoon verder groeien
    d.modus = 'groei'; d.geenKlim = d.pad.length; d.pad[d.pad.length - 1].v = false;
    return groeiDraad(d);
  }
  // 3. gewoon groeien: horizontaal, of schuin mee naar beneden
  const r = Math.floor(kop.y/BLOK);
  // (v1.34) zit de draad onder een steile wand (het oppervlak boven hem ligt veel hoger dan zijn diepte)? dan recht omhoog
  const kolK = Math.floor(kop.x/BLOK), opK = oppervlakBoven(kolK, r, kop.x);
  // alleen als de wand achter de draad ligt (de grond loopt in zijn groeirichting omhoog), niet als hij net van een heuvel af kwam
  let wandAchter = false;
  for(let i = 1; i <= 3; i++){ const k = kolK - dir*i; if(k >= 0 && k < level.breed && oppervlakBoven(k, r, (k + 0.5)*BLOK) > opK + BLOK){ wandAchter = true; break; } }
  // en niet als vlak voor hem de grond weer laag ligt (dan zit hij net onder de achterkant van een heuvel of helling)
  let laagVoor = false;
  for(let i = 1; i <= 2; i++){ const k = kolK + dir*i; if(k < 0 || k >= level.breed || oppervlakBoven(k, r, (k + 0.5)*BLOK) > opK + BLOK){ laagVoor = true; break; } }
  if(d.geenKlim !== d.pad.length && wandAchter && !laagVoor && kop.y > opK + DRAAD_DIEPTE_PX + DRAAD_KLIM){
    d.modus = 'omhoog';
    d.pad[d.pad.length - 1].v = true;
    return groeiDraad(d);
  }
  const voor = Math.floor((kop.x + dir*(DRAAD_STAP + DRAAD_RAND))/BLOK);
  if(voor < 0 || voor >= level.breed) return false;           // de rand van het level
  if(!zacht(voor, r)){
    // een steile rand met lucht ervoor? dan de hoek om, naar beneden
    if(blokOp(voor, r) === LEEG && zacht(Math.floor(kop.x/BLOK), Math.floor((kop.y + DRAAD_STAP)/BLOK))){
      d.modus = 'omlaag';
      d.pad[d.pad.length - 1].v = true;
      return groeiDraad(d);
    }
    return false;                                             // steen, muur, water, vuur...: hier houdt het op
  }
  const nx = kop.x + dir*DRAAD_STAP;
  let doel = oppervlakBoven(voor, r, nx) + DRAAD_DIEPTE_PX;
  // gaat de grond verderop omhoog? dan nu al geleidelijk mee omhoog buigen
  for(let i = 1; i <= DRAAD_VOORUIT; i++){
    const k = voor + dir*i;
    if(k < 0 || k >= level.breed || !zacht(k, r)) break;
    doel = Math.min(doel, oppervlakBoven(k, r, (k + 0.5)*BLOK) + DRAAD_DIEPTE_PX);
  }
  // maar nooit dichter bij de lucht dan DRAAD_MIN_DIEPTE (boven de draad zelf gemeten)
  doel = Math.max(doel, oppervlakBoven(Math.floor(nx/BLOK), r, nx) + DRAAD_MIN_DIEPTE);
  let dy = Math.max(-DRAAD_MAX_STIJG*DRAAD_STAP, Math.min(DRAAD_MAX_HELLING*DRAAD_STAP, doel - kop.y));
  const len = Math.hypot(DRAAD_STAP, dy);
  const p = { x: kop.x + dir*DRAAD_STAP*DRAAD_STAP/len, y: kop.y + dy*DRAAD_STAP/len, v: false };
  if(!zacht(Math.floor(p.x/BLOK), Math.floor(p.y/BLOK))) return false;
  d.pad.push(p);
  return true;
}
// een punt op de draad, u = afstand vanaf het begin (met een klein golfje erin, zoals een echte schimmeldraad)
function draadPunt(o, u){
  const pad = o.draad.pad, n = pad.length - 1;
  if(n < 1) return { x: pad[0].x, y: pad[0].y, v: false };
  const f = Math.max(0, Math.min(n, u/DRAAD_STAP)), i = Math.min(n - 1, Math.floor(f)), k = f - i;
  const a = pad[i], b = pad[i + 1];
  const x = a.x + (b.x - a.x)*k, y = a.y + (b.y - a.y)*k;
  // golfje dwars op de richting van de draad
  const lengte = Math.hypot(b.x - a.x, b.y - a.y) || 1, nx = -(b.y - a.y)/lengte, ny = (b.x - a.x)/lengte*o.draad.richting;
  const golf = (Math.sin(u*0.17)*2.2 + Math.sin(u*0.061 + 1)*1.4)*Math.min(1, Math.max(0, (u - DRAAD_BUIG)/10));
  return { x: x + nx*golf*o.draad.richting, y: y + ny*golf, v: (a.v && b.v) };
}
function draadStap(o, dt, snelheid){
  const d = o.draad;
  d.lengte += snelheid*dt;
  while((d.pad.length - 1)*DRAAD_STAP < d.lengte){
    if(!groeiDraad(d)){
      // geen zachte grond meer en de speler heeft niet op de draad geklikt: de draad loopt dood.
      // Fungy komt niet meer boven; de draad vervaagt en het stekje verschrompelt.
      const t = staat.tijd;
      d.lengte = (d.pad.length - 1)*DRAAD_STAP;
      d.weg = t; d.vervaag = DRAAD_DOOD_VERVAAG;
      if(o.stekje) o.stekje.weg = t;
      begin(o,'verdwaald'); staat.af++;
      return;
    }
  }
}
// kan de speler nu op de draad klikken? Niet zolang de kop recht naar beneden kruipt.
const draadKlikbaar = o => o.fase === 'draad' && o.draad.modus !== 'omlaag' && o.draad.modus !== 'omhoog';   // (v1.34) ook niet tijdens het klimmen
// kan Fungy op deze plek van de draad naar boven? Alleen door zachte grond, niet door steen.
function uitkomPlek(o, lengte){
  const kop = draadPunt(o, lengte), kol = Math.floor(kop.x/BLOK);
  let r = Math.floor(kop.y/BLOK) - 1;
  while(r > 0 && zacht(kol, r)) r--;
  return vast(kol, r) ? null : { kop, kol, r };
}
// de speler klikt op de draad: de draad schiet uit de grond en Fungy springt eruit
function uitkomen(o){
  if(!draadKlikbaar(o)) return;
  const t = staat.tijd, plek = uitkomPlek(o, o.draad.lengte);
  if(!plek){ meld(TEKST.steenBoven); return; }
  const { kop, kol } = plek; let r = plek.r;
  o.x = kop.x; o.draad.weg = t;
  if(o.stekje) o.stekje.weg = t;   // Fungy komt boven: het stekje gaat verschrompelen
  const bij = blokOp(kol, r);
  if(bij === WATER || bij === VUUR){
    while(r > 0 && blokOp(kol, r-1) === bij) r--;
    o.y = r*BLOK; gaatDood(o, bij === WATER ? 'plons' : 'roet'); o.draadResten = o.draad; return;
  }
  o.oppY = (r+1)*BLOK;
  // op een helling: precies op het schuine vlak boven de grond komen
  const hl = objectOp(kol, r+1);
  if(hl && hl.soort === 'helling'){ const hy = hellingOppervlak(hl, o.x); if(Math.abs(hy - o.oppY) < BLOK*1.5) o.oppY = hy; }
  o.y = o.oppY + FIGUUR_HOOGTE;
  begin(o,'opspringen'); o.frame = 2;
  deeltjes(o.x, o.oppY, 18, { hoek:-Math.PI/2, spreiding:1.6, vMin:60, vMax:190, zw:500, leven:0.5, r:1.3, kleur:'rgb(150,100,60)', gloed:false, breed:12 });
  deeltjes(o.x, o.oppY, 12, { hoek:-Math.PI/2, spreiding:1.2, vMin:40, vMax:140, leven:0.5, r:1, fonkel:0.5, kleur:'rgb(255,225,185)' });
}
function opspringStap(o){
  const v = Math.min(1, (staat.tijd - o.faseStart)/OPSPRING_DUUR), fh = FIGUUR_HOOGTE;
  const start = o.oppY + fh, top = o.oppY - OPSPRING_HOOGTE*fh, piek = 0.45;
  if(v < piek){ const k = v/piek; o.y = start + (top - start)*(1 - (1-k)*(1-k)); }
  else { const k = (v - piek)/(1 - piek); o.y = top + (o.oppY - top)*k*k; }
  if(v >= 1){ o.y = o.oppY; begin(o,'landen'); o.frame = 1;
    deeltjes(o.x, o.y, 8, { hoek:-Math.PI/2, spreiding:2.6, vMin:20, vMax:60, zw:300, leven:0.3, r:1, kleur:'rgb(150,100,60)', gloed:false, breed:16 }); }
}
// Fungy wordt een paddenstoel
function wordPaddenstoel(o){
  o.fase = 'paddenstoel';
  staat.paddenstoelen.push({ x: o.x, y: o.y, richting: o.richting, start: staat.tijd, klaar: null, boing: null });
  deeltjes(o.x, o.y - FIGUUR_HOOGTE*0.6, 14, { vMin:20, vMax:80, leven:0.6, r:1.1, fonkel:0.6, kleur:() => `hsl(${290+Math.random()*50|0},90%,78%)` });
}
// iemand stuitert van de hoed: schuin vooruit wegkaatsen
function kaats(o, p, opgestapt){
  p.boing = staat.tijd;
  // Alleen wie vanaf de grond op de hoed stapt: zit er recht boven zijn hoofd rots of iets anders vast,
  // dan wordt hij geplet tegen het plafond. (Wie van boven op de hoed valt, had daar ruimte; een wand ernaast telt niet.)
  if(opgestapt){
    const kol = Math.floor(o.x/BLOK);
    for(let r = Math.floor((o.y - FIGUUR_HOOGTE*0.85)/BLOK); r <= Math.floor((o.y - 2)/BLOK); r++)
      if(vast(kol, r)){ gaatDood(o, o.type === 'balloony' ? 'pletter' : 'plof'); return; }
  }
  begin(o,'vallen'); o.vx = o.richting*KAATS_VX; o.vy = -KAATS_VY; o.valStart = o.y;
  deeltjes(o.x, o.y, 8, { hoek:-Math.PI/2, spreiding:1.8, vMin:30, vMax:90, leven:0.45, r:1, fonkel:0.5, kleur:() => `hsl(${300+Math.random()*40|0},90%,80%)` });
}
// een lopende oelieboelie komt bij de steel: sprongetje op de hoed
function bijPaddenstoel(o){
  for(const p of staat.paddenstoelen){
    if(p.klaar == null) continue;
    const voor = (p.x - o.x)*o.richting;
    if(voor > -HOED_HALF*0.3 && voor < HOED_HALF*0.6 && o.y > p.y - 2.5*BLOK && o.y < p.y + 1.5*BLOK){
      begin(o,'opstappen'); o.x0 = o.x; o.y0 = o.y; o.pad = p; return true;
    }
  }
  return false;
}
function opstapStap(o){
  const p = o.pad, v = Math.min(1, (staat.tijd - o.faseStart)/OPSTAP_DUUR);
  const ex = p.x + o.richting*4, ey = p.y - HOED_TOP, top = ey - 10;
  o.x = o.x0 + (ex - o.x0)*v;
  o.y = (1-v)*(1-v)*o.y0 + 2*(1-v)*v*top + v*v*ey;
  if(v >= 1) kaats(o, p, true);
}

// ---- Balloony ----
// De ballon: o.x/o.y = midden van de onderkant van de mand. Bovenin de ballon zelf (breed),
// onderin de touwen en de mand (smaller). Raakt dat iets vasts?
function ballonBotst(x, y, hoogte){
  const h = hoogte || BALLON_HOOGTE, cx = x + BALLON_HUID_DX;
  const rij0 = Math.floor((y - h)/BLOK), rij1 = Math.floor((y - 1)/BLOK);
  for(let r = rij0; r <= rij1; r++){
    const mand = r*BLOK + BLOK/2 > y - MAND_HOOGTE*(h/BALLON_HOOGTE);
    const l = mand ? x - MAND_HALF : cx - HUID_HALF, rr = mand ? x + MAND_HALF : cx + HUID_HALF;
    for(let k = Math.floor(l/BLOK); k <= Math.floor(rr/BLOK); k++){
      if(k < 0 || k >= level.breed) continue;     // buiten de bladzijde: daar zweeft hij gewoon het beeld uit
      if(vast(k, r)) return true;
    }
  }
  return false;   // boven het level is alleen lucht: daar stijgt hij gewoon het beeld uit
}
// hoeveel ruimte is er RECHT BOVEN Balloony om de ballon op te blazen? (wat naast hem staat telt niet mee)
const BALLON_VRIJ_ONDER = 2*BLOK;   // (v1.14) een trede of schuine plank vlak naast zijn voeten is geen plafond
function ballonRuimte(o){
  const k0 = Math.floor((o.x - 8)/BLOK), k1 = Math.floor((o.x + 8)/BLOK);
  for(let h = BALLON_VRIJ_ONDER + 4; h <= BALLON_HOOGTE; h += 4){
    const r = Math.floor((o.y - 1 - h)/BLOK);
    for(let k = k0; k <= k1; k++) if(k >= 0 && k < level.breed && vast(k, r)) return h;
  }
  return Infinity;
}
// raakt de BOVENKANT van de ballon iets (een plafond)? Wat ernaast staat telt niet mee: daar schuift hij langs.
function ballonRaaktBoven(x, y, kant = 1){
  const cx = x + BALLON_HUID_DX*kant, r = Math.floor((y - BALLON_HOOGTE)/BLOK);
  for(let k = Math.floor((cx - HUID_HALF*0.8)/BLOK); k <= Math.floor((cx + HUID_HALF*0.8)/BLOK); k++)
    if(k >= 0 && k < level.breed && vast(k, r)) return true;
  return false;
}
// raakt de VOORKANT van de ballon of de mand iets (een muur)? (kant 1 = rechts, -1 = links; sinds v1.27)
function ballonRaaktRechts(x, y, kant = 1){
  const kb = Math.floor((x + (BALLON_HUID_DX + HUID_HALF)*kant)/BLOK), km = Math.floor((x + MAND_HALF*kant)/BLOK);
  if(kb < 0 || kb >= level.breed) return false;
  for(let r = Math.floor((y - BALLON_HOOGTE + 4)/BLOK); r <= Math.floor((y - MAND_HOOGTE)/BLOK); r++) if(vast(kb, r)) return true;
  if(km >= 0 && km < level.breed) for(let r = Math.floor((y - MAND_HOOGTE)/BLOK); r <= Math.floor((y - 2)/BLOK); r++) if(vast(km, r)) return true;
  return false;
}
function startBallon(o){
  begin(o,'opblazen'); o.richting = ballonKant(o); o.kussen = true;   // (v1.27) hij houdt de kant aan die hij liep
  o.hangt = false; o.vx = 0;
  o.ruimte = ballonRuimte(o) + 1;
  o.y -= 1;   // net los van de grond
  deeltjes(o.x, o.y - 40, 18, { vMin:30, vMax:110, leven:0.5, r:1.2, fonkel:0.6, kleur:() => `hsl(${Math.floor(Math.random()*360)},90%,75%)` });
}
const ballonMaat = o => o.fase === 'opblazen' ? ballonOpblaas(Math.min(1, (staat.tijd - o.faseStart)/BALLON_OPBLAAS)) : 1;
function ballonOpblaas(v){ const s = 1.70158; const k = v - 1; return 0.35 + 0.65*(1 + (s+1)*k*k*k + s*k*k); }   // met een klein veertje
function ballonStap(o, dt){
  const t = staat.tijd;
  if(o.fase === 'opblazen'){
    const v = Math.min(1, (t - o.faseStart)/BALLON_OPBLAAS);
    if(BALLON_HOOGTE*ballonMaat(o) >= o.ruimte){ knap(o); return; }   // te weinig ruimte: meteen pets!
    if(v >= 1) begin(o,'stijgen');
    return;
  }
  if(o.fase === 'stijgen'){
    const ny = o.y - BALLON_STIJG*dt;
    if(ballonRaaktBoven(o.x, ny, ballonKant(o))) o.hangt = true; else { o.y = ny; o.hangt = false; }
    if(o.y < -beeld.boven - 4){ o.fase = 'weg'; staat.af++; }   // boven het beeld uit gestegen: verloren
    return;
  }
  if(o.fase === 'zweven'){
    const k = ballonKant(o), nx = o.x + BALLON_ZWEEF*k*dt;
    if(ballonRaaktRechts(nx, o.y, k)) o.hangt = true; else { o.x = nx; o.hangt = false; }
    const bx = o.x + BALLON_HUID_DX*k;   // midden van de ballon
    if((k > 0 && bx - HUID_HALF - 10 > level.B) || (k < 0 && bx + HUID_HALF + 10 < 0)){ o.fase = 'weg'; staat.af++; }   // het beeld uit: verloren
  }
}
// de speler klikt op de ballon
function ballonKlik(o){
  if(o.fase === 'stijgen'){ begin(o,'zweven'); o.hangt = false; return; }
  if(o.fase === 'zweven' && o.kussen){ laatKussenVallen(o); return; }
  if(o.fase === 'zweven') knap(o);
}
function laatKussenVallen(o){
  o.kussen = false;
  staat.kussens.push({ x: o.x + 4*ballonKant(o), y: o.y - 13, vy: 0, draai: 0, ligt: null, boing: null });
}
// de ballon knapt: de knal blijft hangen waar de ballon was, Balloony valt eruit
function knap(o){
  const maat = ballonMaat(o);
  staat.knallen.push({ x: o.x + BALLON_HUID_DX*maat*ballonKant(o), y: o.y - BALLON_TOP*maat, maat, start: staat.tijd });
  deeltjes(o.x + BALLON_HUID_DX*maat*ballonKant(o), o.y - BALLON_HOOGTE*maat*0.7, 20, { vMin:40, vMax:160, leven:0.45, r:1.3, fonkel:0.5, kleur:() => ['#e8553f','#f2a33a','#3fa5a8','#f5dfc0'][Math.floor(Math.random()*4)] });
  const vaart = (o.fase === 'zweven' && !o.hangt) ? BALLON_ZWEEF*ballonKant(o) : 0;   // hij zweefde: die vaart neemt hij mee
  o.kussen = false;   // knapt hij al bij het opblazen, dan gaat het kussen verloren
  const til = Math.min(12*maat, Math.max(0, (o.ruimte || 999) - FIGUUR_HOOGTE - 2));
  begin(o,'vallen'); o.y = Math.max(o.y - til, BLOK*1); o.vy = 0; o.vx = vaart; o.valStart = o.y; o.uitBallon = true;
  // niet met zijn hoofd in een muur beginnen
  while(o.y > o.valStart - 30 && vast(Math.floor(o.x/BLOK), Math.floor((o.y - 1)/BLOK))) o.y -= BLOK;
  o.valStart = o.y;
}
// een liggend kussen onder deze plek?
function kussenOnder(x, y){
  for(const k of staat.kussens) if(k.ligt !== null && Math.abs(k.y - y) <= BLOK && Math.abs(k.x - x) <= KUSSEN_VANG) return k;
  return null;
}
function kussenStap(k, dt){
  if(k.ligt !== null) return;
  k.vy = Math.min(MAX_VALSNELHEID, k.vy + ZWAARTEKRACHT*dt); k.draai += dt*2.5;
  const ny = k.y + k.vy*dt, cx = Math.floor(k.x/BLOK);
  for(let r = Math.floor(k.y/BLOK)+1; r*BLOK <= ny; r++){
    const s = blokOp(cx, r);
    if(s === WATER){ k.y = r*BLOK; k.weg = true; deeltjes(k.x, k.y, 12, { hoek:-Math.PI/2, spreiding:1.4, vMin:60, vMax:160, zw:600, leven:0.4, r:1.1, kleur:'rgb(170,215,255)', gloed:false }); return; }
    if(s === VUUR){ k.y = r*BLOK; k.weg = true; deeltjes(k.x, k.y - 6, 16, { hoek:-Math.PI/2, spreiding:1.2, vMin:15, vMax:60, leven:0.8, r:2, kleur:'rgb(55,55,60)', gloed:false, breed:20 }); return; }
    if(vast(cx, r)){
      k.y = r*BLOK; k.ligt = staat.tijd;
      deeltjes(k.x, k.y, 10, { hoek:-Math.PI/2, spreiding:2.6, vMin:20, vMax:70, zw:300, leven:0.35, r:1.1, kleur:'rgb(225,200,160)', gloed:false, breed:30 });
      return;
    }
  }
  k.y = ny;
  if(k.y > level.H + 60) k.weg = true;
}

// ---- Bomby ----
// Bomby zet zijn dynamietstaaf meteen neer waar hij staat, draait om en loopt terug.
// Het lontje brandt 3 seconden, dan: boem. Daarna loopt Bomby verder met een lege hand.
const BOMBY_LEG_FPS = 11;        // tempo van het neerleggen (8 beeldjes = ruim 0,7 sec)
const BOM_LOS_BEELD = 4;         // vanaf dit beeldje (0 t/m 7) staat de staaf los op de grond en tekent de code hem
const LONT_DUUR = 3;             // zo lang brandt het lontje
const BOEM_BREED = 6, BOEM_HOOG = 6;   // grootte van het gat, in blokjes (een o is 6 blokjes hoog)
const DEUK_BREED = 4, DEUK_DIEP = 2;   // de kuil onder de bom: 4 breed, aan de randen 1 diep, in het midden 2
const BOEM_BEELD = [0.05, 0.06, 0.09, 0.1, 0.12, 0.14, 0.15, 0.18];   // hoe lang elk beeldje van de knal blijft staan
const BOEM_TOTAAL = BOEM_BEELD.reduce((a, b) => a + b, 0);
const BOEM_SCHAAL = 0.48;        // grootte van de getekende knal (de grootste vuurbal wordt zo'n 76 spelpixels breed)
const BOEM_CEL = 165, BOEM_ANKER_X = 83.2, BOEM_ANKER_Y = 113.1;   // plek van de flits in het eerste beeldje
const WOLKJE_BEELD = 0.13;       // het wolkje als er een ding verdwijnt: de rookbeeldjes 5 t/m 8 van de knal
const WOLKJE_DUUR = 4*WOLKJE_BEELD;
const SLINGER_DUUR = 1.5;        // zo lang vliegt een weggeslingerde o door de lucht
const SLINGER_ZW = 900;          // zwaartekracht tijdens het wegslingeren
const KANTEL_DUUR = 0.45;        // zo lang duurt het kantelen van een balk
const GLIJ_HOEK = 55, GLIJ_KIEP = 0.38;   // een balk die van zijn steunpunt glijdt: zo ver kiept hij eerst om (graden), in zoveel seconden
const WIEBEL_DUUR = 0.8, WIEBEL_HOEK = 0.09, WIEBEL_KEER = 3;   // een staande balk die neerkomt, wiebelt even na (duur, grootste uitslag in radialen ≈ 5°, aantal keer heen en weer)
const STEIL_VANAF = 45;
const SCHUIN_STAP = 4;            // op het lage uiteinde van een flauw gekantelde balk stappen ze vanzelf (de balk is 2 blokjes dik)          // een gekantelde balk die steiler ligt dan dit (graden), is een steile helling
// de losse dynamietstaaf (bom.png: uit Arjens neerlegreeks geknipt, 3 keer zo scherp bewaard)
const BOM = { w: 41, h: 105, dx: 50.13, staafTop: 23.1,
  pad: [[15.2, 0.0], [20.8, 3.0], [23.6, 6.0], [26.1, 9.0], [27.6, 12.1], [27.6, 15.1], [27.1, 18.1], [26.1, 21.1]] };
const BOM_SCHAAL = FIGUUR_HOOGTE/128/3;     // van plaatjespixels naar spelpixels
const BOM_VOOR = (BOM.dx + BOM.w/6)*FIGUUR_HOOGTE/128;   // zo ver voor Bomby staat het midden van de staaf

// Bomby weigert een bom te leggen als het hondje dan ontploft: hij schudt verontwaardigd van nee (bomby_nee.png)
// en loopt daarna door met de staaf nog in zijn hand. Klik je hem later opnieuw aan, dan legt hij hem alsnog (gratis).
const WEIGER_BEELD = [0.13, 0.16, 0.22, 0.17, 0.17, 0.2, 0.38, 0.17];   // hoe lang elk beeldje van het weigeren duurt
function startBomby(o){
  o.bomWeg = false;
  begin(o, hondInBereik(o) ? 'weigeren' : 'leggen'); o.frame = 0; o.frameTijd = 0;
}
// Waar komt de staaf te staan? Zo ver mogelijk voor Bomby (zoals in de tekening), maar altijd óp iets:
// niet in een muur, niet in de lucht (bijvoorbeeld tussen de treden van een trap door) en anders op de
// volgende trede als die net een blokje hoger ligt. Lukt dat nergens, dan bij zijn eigen voeten.
function bomPlek(o){
  const rv = Math.round(o.y/BLOK);
  for(let d = BOM_VOOR; d >= 0; d -= 1){
    const x = o.x + o.richting*d, k = Math.floor(x/BLOK);
    const k2 = Math.floor((x + o.richting*3)/BLOK);   // de staaf is een paar pixels breed
    if(!vast(k, rv - 1) && !vast(k2, rv - 1) && vast(k, rv)) return { x, y: o.y };
    if(vast(k, rv - 1) && !vast(k, rv - 2) && !vast(k, rv - 3) && !vast(k2, rv - 2)) return { x, y: (rv - 1)*BLOK };
  }
  return { x: o.x, y: o.y };
}
function hondInBereik(o){
  const p = bomPlek(o), x = p.x, kol = Math.round(x/BLOK), rv = Math.round(p.y/BLOK);
  const x0 = (kol - Math.floor(BOEM_BREED/2))*BLOK, x1 = (kol + Math.ceil(BOEM_BREED/2))*BLOK, y0 = (rv - BOEM_HOOG)*BLOK, y1 = (rv + DEUK_DIEP)*BLOK;
  return level.objecten.some(h => { if(h.soort !== 'hond') return false; const m = objectMaat(h);
    return h.x*BLOK < x1 && (h.x + m.b)*BLOK > x0 && h.y*BLOK < y1 && (h.y + m.h)*BLOK > y0; });
}
function weigerenStap(o){
  let v = staat.tijd - o.faseStart, i = 0;
  while(i < 8 && v >= WEIGER_BEELD[i]){ v -= WEIGER_BEELD[i]; i++; }
  if(i >= 8){ begin(o,'lopen'); o.frame = 0; o.frameTijd = 0; return; }   // klaar met mopperen: gewoon doorlopen
  o.frame = i;
}
function leggenStap(o){
  const beeld = Math.floor((staat.tijd - o.faseStart)*BOMBY_LEG_FPS);
  o.frame = Math.min(7, beeld);
  if(beeld >= BOM_LOS_BEELD && !o.bomWeg) zetBomNeer(o);
  if(beeld >= 8){   // klaar: omdraaien en teruglopen
    o.richting *= -1; o.draaiX = o.x; o.stapX = null;
    begin(o,'lopen'); o.frame = 0; o.frameTijd = 0;
  }
}
function zetBomNeer(o){
  o.bomWeg = true;
  const p = bomPlek(o);
  staat.bommen.push({ x: p.x, y: p.y, richting: o.richting, start: staat.tijd, vy: 0 });
}
// waar het vonkje op het lontje zit (in plaatjespixels), v = 0 (net aangestoken) t/m 1 (boem)
function lontPunt(v){
  const p = BOM.pad, y = p[0][1] + v*(BOM.staafTop - p[0][1]);
  let i = 1; while(i < p.length - 1 && p[i][1] < y) i++;
  const a = p[i-1], b = p[i], f = Math.max(0, Math.min(1, (y - a[1])/Math.max(0.01, b[1] - a[1])));
  return { x: a[0] + (b[0] - a[0])*f, y };
}
function bomStap(b, dt){
  const t = staat.tijd, kol = Math.floor(b.x/BLOK);
  // de grond onder de bom is weg (bijvoorbeeld door een andere bom): dan valt hij
  if(!vast(kol, Math.round(b.y/BLOK)) || b.vy > 0){
    b.vy = Math.min(MAX_VALSNELHEID, b.vy + ZWAARTEKRACHT*dt);
    const ny = b.y + b.vy*dt;
    for(let r = Math.floor(b.y/BLOK) + 1; r*BLOK <= ny; r++){
      const s = blokOp(kol, r);
      if(s === WATER){   // sssst: uit
        b.weg = true; deeltjes(b.x, r*BLOK, 10, { hoek:-Math.PI/2, spreiding:1.2, vMin:15, vMax:50, leven:0.6, r:1.6, kleur:'rgba(230,236,245,.9)', gloed:false });
        return;
      }
      if(vast(kol, r)){ b.y = r*BLOK; b.vy = 0; break; }
    }
    if(b.vy > 0) b.y = ny;
    if(b.y > level.H + 40){ b.weg = true; return; }
  }
  // vonkjes van het lontje
  const v = Math.min(1, (t - b.start)/LONT_DUUR), p = lontPunt(v);
  if(Math.random() < dt*22) deeltjes(b.x + b.richting*(p.x - BOM.w/2)*BOM_SCHAAL, b.y + (p.y - BOM.h)*BOM_SCHAAL, 1,
    { vMin:15, vMax:55, leven:0.25, r:0.6, fonkel:0.7, kleur: () => Math.random() < 0.5 ? 'rgb(255,230,120)' : 'rgb(255,160,60)', gloed:false });
  if(t - b.start >= LONT_DUUR) boem(b);
}
// ---- Rocky ----
// Rocky eet zich recht vooruit een gang door zachte grond, zwakke muren en hellingen. Eén gang per Rocky.
// Je kunt hem altijd aanklikken; hij begint vanzelf zodra hij iets eetbaars tegenkomt (ook op een helling of heuvel:
// dan stapt hij niet op, maar eet hij er horizontaal doorheen). Wat boven de gang zit, blijft gewoon staan.
// Klik tijdens het eten: stoppen en omdraaien. Steen: KRAK, hij draait om en zijn beurt is voorbij.
const ROCKY_RIJEN = 8;           // zo hoog is de gang, in blokjes (Rocky is 7,5 blokje; een gewone o 6)
const ROCKY_STEEN_RIJEN = 7;     // alleen steen in de onderste 7 rijen van de gang telt (KRAK); steen in de bovenste rij blijft gewoon zitten
const ROCKY_VOOR = 12;           // zo ver voor zijn midden zit zijn mond (spelpixels)
const ROCKY_HAP = 3;             // zoveel blokjes diep eet hij per hap
const ROCKY_EET_FPS = 10;        // tempo van de eetreeks (8 beeldjes = 0,8 sec per hap)
const ROCKY_HAP_BEELD = 3;       // in dit beeldje (0 t/m 7) klapt zijn mond dicht: CHOMP
const ROCKY_STAP_BEELD = 5;      // vanaf dit beeldje schuift hij op naar de nieuwe wand
const KRAK_BEELD = [0.11, 0.11, 0.2, 0.18, 0.2, 0.2, 0.24, 0.2];   // hoe lang elk beeldje van de mislukte hap duurt
const KRAK_MOMENT = 2;           // in dit beeldje bijt hij op het steen
const KRAK_DUUR = KRAK_BEELD.reduce((a, b) => a + b, 0);
const ROCKY_KRUIMEL = { [GROND]: 'rgb(139,92,52)', [MUUR]: 'rgb(186,98,62)', [OBJECT]: 'rgb(139,92,52)' };
// wat zit er in deze kolom, ter hoogte van Rocky's lijf? 'steen', 'eten' of null
function eetbaar(bx, by){
  const s = blokOp(bx, by);
  if(s === GROND || (s === MUUR && matOp(bx, by) !== MAT_CHIP)) return true;   // (v1.54) printplaat niet: daar krijgt hij een schokje
  if(s === OBJECT){ const o = objectOp(bx, by); return !!(o && o.soort === 'helling'); }
  return false;
}
function rockyKolom(bx, voetRij){
  if(bx < 0 || bx >= level.breed) return null;
  let eten = false;
  for(let r = voetRij - 1; r >= voetRij - ROCKY_RIJEN; r--){
    if(r < 0) break;
    if(blokOp(bx, r) === STEEN){ if(r >= voetRij - ROCKY_STEEN_RIJEN) return 'steen'; continue; }
    if(isChip(bx, r)){ if(r >= voetRij - ROCKY_STEEN_RIJEN) return 'schok'; continue; }   // (v1.54) printplaat: BZZT
    if(eetbaar(bx, r)) eten = true;
  }
  return eten ? 'eten' : null;
}
// een lopende Rocky die zijn gang nog niet gegeten heeft: komt hij iets tegen?
function rockyKijkt(o, dt, snelheid){
  const voetRij = Math.round(o.y/BLOK), bx = Math.floor((o.x + o.richting*(ROCKY_VOOR + snelheid*dt))/BLOK);
  const wat = rockyKolom(bx, voetRij);
  if(wat === 'steen' || wat === 'schok'){ startKrak(o, wat === 'schok'); return true; }
  if(wat === 'eten'){
    // begin bij de eerste eetbare kolom vanaf zijn eigen midden: wat tussen zijn lijf en zijn mond zit, eet hij ook op
    // (anders blijft daar een randje helling of heuvel staan, bijvoorbeeld als je hem vlak voor een helling aanklikt)
    let start = bx;
    for(let c = Math.floor(o.x/BLOK); c !== bx; c += o.richting) if(rockyKolom(c, voetRij) === 'eten'){ start = c; break; }
    begin(o, 'eten'); o.frame = 0; o.frameTijd = 0; o.eetKolom = start; o.hapGedaan = false; return true;
  }
  return false;
}
function startKrak(o, schok){ begin(o, 'krak'); o.frame = 0; o.gekrakt = false; o.hapOp = true; o.schok = !!schok; }   // schok = (v1.54) in een printplaat gebeten
function klaarMetEten(o, omdraaien){
  o.hapOp = true; begin(o, 'lopen'); o.frame = 0; o.frameTijd = 0;
  if(omdraaien) draaiOm(o);
}
// één hap: de kolommen vóór Rocky leeg eten (tot steen, of tot er niets meer te eten is)
function rockyHap(o){
  const voetRij = Math.round(o.y/BLOK), d = o.richting;
  let laatste = null;
  for(let i = 0; i < ROCKY_HAP; i++){
    const bx = o.eetKolom + d*i, wat = rockyKolom(bx, voetRij);
    if(wat !== 'eten') break;
    for(let r = voetRij - 1; r >= Math.max(0, voetRij - ROCKY_RIJEN); r--){
      level.gang.add(r*level.breed + bx);   // de hele gang onthouden (ook de lege hokjes erin)
      if(!eetbaar(bx, r)) continue;
      const k = r*level.breed + bx, s = level.raster[k];
      if(s === OBJECT){
        const hl = objectOp(bx, r);
        if(hl){ (hl.gegeten = hl.gegeten || new Set()).add(k); }
        level.objKaart[k] = -1; level.onder.delete(k);

const ROBY_KRUIMEL = { [GROND]: 'rgb(139,92,52)', [MUUR]: 'rgb(186,98,62)', [BAKSTEEN]: 'rgb(200,92,60)', [STEEN]: 'rgb(150,156,166)', [OBJECT]: 'rgb(139,92,52)' };

// kist, boom, put of cactus in de weg: die verdwijnt met een wolkje

    const m = objectMaat(ob); level.objecten.splice(i, 1);

// klaar met boren: even uithijgen, dan (zo nodig ondersteboven terugdraaien en) naar de wolk

// is er open lucht boven dit punt, tot de bovenkant van het level?

function robyKlaarStap(o){

function robyDraaiStap(o){

// ondersteboven omhoog vliegen tot de boorpunt het plafond raakt

function robyStap(o, dt, snelheid){

// ---- Roby tekenen ----
function tekenRobyFiguur(c, x, y, hoek, richting, boorL, boorBeeld, lijfBeeld, maat){
  // (x, y) = de boorpunt; hoek 0 = rechtop (boor naar beneden), PI = ondersteboven
  const s = ROBY_S*maat;
  c.save(); c.translate(x, y); c.rotate(hoek);

  if(boorL > 0.4 && ROBY_BOOR.img.complete){
    const f = boorL/ROBY_BOOR_L;   // de boor wordt kleiner terwijl hij boort
    c.save(); c.translate(0, kap - 1); c.scale(richting*s*f, s*f);
    c.drawImage(ROBY_BOOR.img, boorBeeld*ROBY_BOOR.cel, 0, ROBY_BOOR.cel, ROBY_BOOR.celH, -ROBY_BOOR.ankerX, -ROBY_BOOR.ankerY, ROBY_BOOR.cel, ROBY_BOOR.celH);
    c.restore();
  }
  if(ROBY_LIJF.img.complete){
    c.translate(0, kap); c.scale(richting*s, s);
    c.drawImage(ROBY_LIJF.img, lijfBeeld*ROBY_LIJF.cel, 0, ROBY_LIJF.cel, ROBY_LIJF.celH, -ROBY_LIJF.ankerX, -ROBY_LIJF.ankerY, ROBY_LIJF.cel, ROBY_LIJF.celH);
  }
  c.restore();
}
function tekenRoby(o){
  const t = staat.tijd;
  let x, y, hoek = o.hoek || 0, alpha = 1, maat = 1, extraDraai = 0;
  const deint = Math.sin(t*3.1 + (o.geboren || 0)*7)*1.2;
  if(o.fase === 'vliegen' || o.fase === 'zakken' || o.fase === 'dood' || o.fase === 'weg'){
    const opstijg = Math.min(1, (t - (o.robyStart ?? -9))/0.3);
    x = o.x; y = o.y - ROBY_ZWEEF*opstijg + (o.glad || 0) + deint*opstijg;
  } else { x = o.tipX ?? o.x; y = o.tipY ?? o.y; if(o.fase === 'naarWolk' || o.fase === 'terug' || o.fase === 'robyKlaar') y += deint*0.6; }

  const boorBeeld = o.fase === 'boren' ? Math.floor(t*22) % 8 : 0;
  ctx.save(); ctx.globalAlpha = Math.max(0, alpha);
  if(extraDraai){ const mid = (robyBoorL(o) + ROBY_LIJF_H)/2; ctx.translate(x, y - mid); ctx.rotate(extraDraai); ctx.translate(-x, -(y - mid)); }
  tekenRobyFiguur(ctx, Math.round(x*2)/2, Math.round(y*2)/2, hoek, o.richting, robyBoorL(o), boorBeeld, lijfBeeld, maat);
  ctx.restore();

// stippelkader en pijltje bij het tikvak onder de muis
function tekenRobyRichter(){

// ---- BOEM ----
function boem(b){
  b.weg = true;
  const t = staat.tijd, kol = Math.round(b.x/BLOK), rv = Math.round(b.y/BLOK);
  const half = BOEM_BREED/2, k0 = kol - Math.floor(half), k1 = kol + Math.ceil(half) - 1;   // kolommen van het gat
  const r0 = rv - BOEM_HOOG;                                                                 // bovenste rij van het gat

  staat.boems.push({ x: b.x, y: b.y - 6, start: t });
  // 1. spullen en bouwvormen die geraakt worden, verdwijnen met een wolkje (decor blijft staan)
  const raakt = (x, y, w, h) => x < vak.x1 && x + w > vak.x0 && y < vak.y1 && y + h > vak.y0;
  let weg = false;
  for(const o of [...level.objecten]){
    if(isDecor(o) || o.soort === 'parachute') continue;
    const m = objectMaat(o);
    if(!raakt(o.x*BLOK, o.y*BLOK, m.b*BLOK, m.h*BLOK)) continue;
    level.objecten.splice(level.objecten.indexOf(o), 1); weg = true;
    staat.wolkjes.push({ x: (o.x + m.b/2)*BLOK, y: (o.y + m.h/2)*BLOK, maat: Math.max(m.b, m.h)*BLOK*1.3, start: t });
  }
  for(const p of staat.parachutes){
    if(p.op) continue;
    const m = objectMaat(p);
    if(raakt(p.x*BLOK, p.y*BLOK, m.b*BLOK, m.h*BLOK)){ p.op = true; staat.wolkjes.push({ x: (p.x + m.b/2)*BLOK, y: (p.y + m.h/2)*BLOK, maat: m.h*BLOK*1.5, start: t }); }
  }
  if(weg){ herstempel(); maakDingZones(); }
  // 2. het gat: zachte grond, zwakke muur en de treden van Buildy gaan kapot; steen blijft heel
  const KLEUR = { [GROND]: 'rgb(139,92,52)', [MUUR]: 'rgb(186,98,62)', [BAKSTEEN]: 'rgb(200,92,60)' };
  for(let by = r0; by < rv + DEUK_DIEP; by++) for(let bx = k0; bx <= k1; bx++){
    if(by >= rv){   // de kuil: smaller dan het gat, aan de randen 1 diep, in het midden 2

      if(plek < -DEUK_BREED/2 || plek >= DEUK_BREED/2) continue;
      const rand = plek === -DEUK_BREED/2 || plek === DEUK_BREED/2 - 1;
      if(by - rv >= (rand ? DEUK_DIEP - 1 : DEUK_DIEP)) continue;

    if(by === r0 && (bx === k0 || bx === k1)) continue;                    // ronde hoekjes bovenaan

    const s = blokOp(bx, by);
    if(s !== GROND && s !== MUUR && s !== BAKSTEEN) continue;
    level.raster[by*level.breed + bx] = LEEG;
    deeltjes((bx + 0.5)*BLOK, (by + 0.5)*BLOK, 2, { hoek: -Math.PI/2, spreiding: 2.6, vMin: 60, vMax: 210, zw: 650, leven: 0.55, r: 1.3, kleur: kruimelKleur(bx, by, s, KLEUR[s]), gloed: false });
  }
  // 3. wat niet meer gedragen wordt, valt of kantelt

  for(const f of [...staat.vallers]){
    if(f.soort !== 'kantel') continue;
    const kolom = f.kant < 0 ? Math.floor(f.P[0]/BLOK) : Math.floor(f.P[0]/BLOK) - 1;
    if(vast(kolom, Math.round(f.P[1]/BLOK))) continue;   // het steunpunt staat er nog

    level.objecten.push(f.o); herstempel(); startVal(f.o);
  }

  herplanVallers();

  // 4. o's vlakbij: weggeslingerd
  const KWETSBAAR = ['vliegen','zakken','lopen','vallen','bouwen','eten','krak','leggen','weigeren','glijden','veren','aanloop','duiken','opspringen','landen','opstappen','opblazen','stijgen','zweven','verschijnen'];
  for(const o of staat.oelies){
    if(!KWETSBAAR.includes(o.fase)) continue;
    if(o.x + 8 < vak.x0 - 4 || o.x - 8 > vak.x1 + 4 || o.y < vak.y0 || o.y - FIGUUR_HOOGTE > vak.y1) continue;
    if(inBallon(o)){ const maat = ballonMaat(o); staat.knallen.push({ x: o.x + BALLON_HUID_DX*maat*ballonKant(o), y: o.y - BALLON_TOP*maat, maat, start: t }); }

  grondWeg();
  // grote knal: een flinke wolk vonken en rook
  deeltjes(b.x, b.y - 18, 18, { vMin: 40, vMax: 160, leven: 0.5, r: 1.2, fonkel: 0.6, kleur: () => Math.random() < 0.5 ? 'rgb(255,214,90)' : 'rgb(255,140,50)', gloed: false });
}
// staat er een o (of Bomby met zijn bom) op een plek waar de grond weg is? Dan valt hij.
function grondWeg(){

    if(!['lopen','bouwen','eten','krak','leggen','weigeren','veren','aanloop','richten','gooien','haakVliegt','trekken','oprollen','vasthouden'].includes(o.fase)) continue;

// ---- objecten opnieuw in het raster zetten (na weghalen, vallen of kantelen) ----

// ---- vallende en kantelende dingen (Newton) ----

    for(let by = 0; by < m.h; by++) if(vormHulp.isPointInPath(p, (bx + 0.5)*BLOK, (by + 0.5)*BLOK)){ if(r0 < 0) r0 = by; r1 = by; }

// de vallende boog breekt de treden die hij onderweg raakt (ze vallen als losse steentjes naar beneden)
function zwaarBreekt(f){
